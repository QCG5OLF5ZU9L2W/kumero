# SPDX-License-Identifier: AGPL-3.0-or-later
openapi: 3.1.0
info:
  title: kumero REST-API
  version: 1.0.0-entwurf.1
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  description: |
    **Entwurf 1, O1–O3 entschieden am 2026-11-17 (F78).** Vertrag vor dem Code (F18).
    Umfang dieses Entwurfs (ANWENDUNG.md E8 b): Anmeldung, Stammdaten,
    Geschäftsjahre, Buchungen mit Freigabe, Abfragen Kontoblatt und Salden.
    Rechte, Webhooks, Protokoll und Siegel folgen in einem zweiten Entwurf.

    **Seit kumero 0.7.6 (F97, F96)**: `/belege/…` (Belegarchiv), `PUT /arbeitsvorrat/eintraege/vorauswahl`.
    **Seit kumero 0.7.4 (F92)**: Endpunkte des Moduls `paperless`.
    **Seit kumero 0.7.3 (F89)**: Endpunkte des Moduls `arbeitsvorrat`.
    **Seit kumero 0.7.2 (F88)**: Belegverweis mit `link` statt `paperless_id`; `belege_nachgereicht` an der Buchung.
    **Seit kumero 0.7.1 (F86)**: `PATCH /api/v1/ich`, `GET`/`PUT /api/v1/ich/einstellungen`.
    **Seit kumero 0.7.0 (F83)** sind Buchungen, Freigabe, Salden und Kontoblatt umgesetzt. Ergänzt wurden
    `reihenfolge` bei `GET /buchungen`, `konto` bei `GET /salden`, die Antwort 428 ohne `If-Match` und die
    Endpunkte des Moduls `buchen` (Geschäftsvorfälle). Noch nicht umgesetzt: `/passkeys`, Sperren und Öffnen
    von Geschäftsjahren (die Challenge dafür antwortet 501).

    Grundregeln (F19, ANWENDUNG.md Abschnitt 3):
    - Globale Pfade unter `/api/v1`, Mandantenpfade unter `/m/{mandant}/api/v1` (F39).
    - Anmeldung per Sitzungs-Cookie `__Host-kumero` (Passkey, E2) oder
      `Authorization: Bearer kmr_…` (Dienstkonto, nur für seinen Mandanten).
    - Jeder schreibende Aufruf (POST, PUT, PATCH, DELETE) im Mandanten verlangt
      `Idempotency-Key`. Eine Wiederholung liefert die gespeicherte Antwort mit
      `Idempotency-Replayed: true`; derselbe Schlüssel mit anderer Anfrage ergibt 409 (`KM006`).
    - Entwürfe tragen ein `ETag`; Ändern, Löschen und Vorbereiten verlangen `If-Match` (412 bei Abweichung, `KM005`;
      428 `etag.fehlt`, wenn der Kopf fehlt). `If-Match: *` gilt für jeden Stand.
    - Beträge und Kurse sind **Dezimal-Strings**, nie Zahlen (F19, F24): Betrag immer positiv, Seite `S`/`H`.
    - Datumsangaben `YYYY-MM-DD`, Zeitpunkte RFC 3339 in UTC.
    - Listen seitenweise per `cursor` (undurchsichtig) und `anzahl`; die Antwort nennt `weiter`.
    - Fehler als Problem Details (RFC 9457) mit festem `code` und übersetztem `title` (Sprache aus
      `Accept-Language` bzw. Nutzerprofil, T5). Server-Logs enthalten keine Buchungsinhalte.
    - Jede Operation nennt in `x-kumero-recht` das nötige Recht (F41); fehlt es, folgt 403.

    Freigabe per WebAuthn (F38, F66–F68) in drei Schritten:
    1. Gegenstand vorbereiten (Buchungen: `POST …/vorbereiten`; Geschäftsjahr: entfällt).
    2. `POST /freigaben/challenge` mit Art und Gegenstand → anzuzeigender Inhalt, Inhalts-Hash
       und die Optionen für `navigator.credentials.get()`.
    3. Ausführen (`POST /freigaben` bzw. `…/sperren`) mit Challenge-ID und Assertion.
    Im Testbetrieb (F59) darf die Assertion fehlen; die Buchung wird als Testbuchung gekennzeichnet.
servers:
  - url: https://kumero.example.org

tags:
  - name: Anmeldung
  - name: Stammdaten
  - name: Geschäftsjahre
  - name: Buchungen
  - name: Freigabe
  - name: Abfragen
  - name: Oberfläche
  - name: Kontenrahmen
    description: Modul kontenrahmen (KONTENRAHMEN.md, F80)
  - name: Buchen
    description: Modul buchen – Geschäftsvorfälle als Vorlagen für die Buchungserfassung (BUCHUNGSMASKE.md, F83)
  - name: Paperless
    description: Modul paperless – eigener Zugang des Nutzers zu Paperless-ngx, Vorschau, geprüfter Belegverweis (PAPERLESS.md, F92)
  - name: Arbeitsvorrat
    description: Modul arbeitsvorrat – Posteingang der Buchhaltung, unabhängig von der Quelle (ARBEITSVORRAT.md, F89)

security:
  - sitzung: []
  - dienstkonto: []

paths:
  # ===========================================================================
  # Global
  # ===========================================================================
  /api/v1/anmeldung/optionen:
    post:
      tags: [Anmeldung]
      summary: Challenge für die Anmeldung mit Passkey
      security: []
      responses:
        '200':
          description: Optionen für navigator.credentials.get()
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebauthnAnfrageOptionen' }
  /api/v1/anmeldung:
    post:
      tags: [Anmeldung]
      summary: Mit Passkey anmelden
      description: Prüft die Assertion (F68 sinngemäß, Art „anmeldung“) und setzt das Sitzungs-Cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebauthnAssertion' }
      responses:
        '200':
          description: Angemeldet
          headers:
            Set-Cookie: { schema: { type: string }, description: '`__Host-kumero=…; Secure; HttpOnly; SameSite=Strict; Path=/`' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ich' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/abmeldung:
    post:
      tags: [Anmeldung]
      summary: Sitzung beenden
      responses:
        '204': { description: Abgemeldet }
  /api/v1/ich:
    get:
      tags: [Anmeldung]
      summary: Eigenes Profil und zugängliche Mandanten
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ich' }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Anmeldung]
      summary: Eigene Sprache setzen (seit 0.7.1, F86); null = wie der Browser. Nur Nutzer, keine Dienstkonten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sprache]
              properties:
                sprache: { type: [string, 'null'], examples: ['de'] }
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ich' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/ich/einstellungen:
    get:
      tags: [Anmeldung]
      summary: Wirksame eigene Einstellungen (gesetzte Werte, sonst Standard; seit 0.7.1, F86)
      responses:
        '200':
          description: Einstellungen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Einstellungen' }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Anmeldung]
      summary: Eigene Einstellungen setzen; nur genannte Schlüssel ändern sich, null stellt den Standard wieder her
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Einstellungen' }
      responses:
        '200':
          description: Wirksame Einstellungen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Einstellungen' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/registrierung/optionen:
    post:
      tags: [Anmeldung]
      summary: Passkey registrieren – Optionen
      description: |
        Mit `token` aus einem Registrierungslink (`bin/kumero nutzer:anlegen`) ohne Anmeldung,
        sonst für den angemeldeten Nutzer selbst.
      security: [ {}, { sitzung: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string, description: Registrierungslink-Token (nur ohne Sitzung) }
      responses:
        '200':
          description: Optionen für navigator.credentials.create()
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebauthnErstellOptionen' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/registrierung:
    post:
      tags: [Anmeldung]
      summary: Passkey registrieren – abschließen
      security: [ {}, { sitzung: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebauthnRegistrierung' }
      responses:
        '201': { description: Passkey registriert }
        '422': { $ref: '#/components/responses/Problem' }

  # ===========================================================================
  # Stammdaten (Anhang A, B1)
  # ===========================================================================
  /m/{mandant}/api/v1/konten:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Stammdaten]
      summary: Konten auflisten
      x-kumero-recht: kern.stammdaten.sehen
      parameters:
        - { name: aktiv, in: query, schema: { type: boolean } }
        - { name: kontoart, in: query, schema: { $ref: '#/components/schemas/Kontoart' } }
      responses:
        '200':
          description: Konten nach Nummer
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Konto' } }
    post:
      tags: [Stammdaten]
      summary: Konto anlegen
      x-kumero-recht: kern.stammdaten.aendern
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KontoNeu' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Konto' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/konten/{nr}:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { name: nr, in: path, required: true, schema: { type: string } }
    get:
      tags: [Stammdaten]
      summary: Konto lesen
      x-kumero-recht: kern.stammdaten.sehen
      responses:
        '200':
          description: Konto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Konto' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Stammdaten]
      summary: Bezeichnung, aktiv oder Kontoart ändern
      description: Die Kontoart ist fest, sobald das Konto bebucht ist (F74 Nr. 1); sonst 409 `KM001`.
      x-kumero-recht: kern.stammdaten.aendern
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                bezeichnung: { type: string }
                aktiv: { type: boolean }
                kontoart: { $ref: '#/components/schemas/Kontoart' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Konto' }
        '409': { $ref: '#/components/responses/Problem' }

  /m/{mandant}/api/v1/tags:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Stammdaten]
      summary: Tags auflisten
      x-kumero-recht: kern.stammdaten.sehen
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Tag' } }
    post:
      tags: [Stammdaten]
      summary: Tag anlegen
      x-kumero-recht: kern.stammdaten.aendern
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                paperless_id: { type: integer }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }

  /m/{mandant}/api/v1/nummernkreise:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Stammdaten]
      summary: Nummernkreise mit Festlegungen je Geschäftsjahr
      x-kumero-recht: kern.stammdaten.sehen
      responses:
        '200':
          description: Nummernkreise
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Nummernkreis' } }
    post:
      tags: [Stammdaten]
      summary: Nummernkreis anlegen
      x-kumero-recht: kern.stammdaten.aendern
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kuerzel, bezeichnung]
              properties:
                kuerzel: { type: string }
                bezeichnung: { type: string }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Nummernkreis' }
  /m/{mandant}/api/v1/nummernkreise/{kuerzel}/jahre/{geschaeftsjahr}:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { name: kuerzel, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/geschaeftsjahr' }
    put:
      tags: [Stammdaten]
      summary: Vorlage und Zurücksetzen für ein Geschäftsjahr festlegen
      description: Nur vor der ersten Vergabe; danach unveränderlich (F25, F74 Nr. 4).
      x-kumero-recht: kern.nummernkreis.festlegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vorlage, zuruecksetzen]
              properties:
                vorlage: { type: string, examples: ['ER-{JJJJ}-{NR:5}'] }
                zuruecksetzen: { type: boolean, description: true = neu je Geschäftsjahr }
      responses:
        '200': { description: Festgelegt }
        '409': { $ref: '#/components/responses/Problem' }

  /m/{mandant}/api/v1/buchungsarten:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Stammdaten]
      summary: Buchungsarten
      x-kumero-recht: kern.stammdaten.sehen
      responses:
        '200':
          description: Buchungsarten
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Buchungsart' } }
    post:
      tags: [Stammdaten]
      summary: Buchungsart anlegen
      x-kumero-recht: kern.stammdaten.aendern
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Buchungsart' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Buchungsart' }

  # ===========================================================================
  # Geschäftsjahre (B2)
  # ===========================================================================
  /m/{mandant}/api/v1/geschaeftsjahre:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Geschäftsjahre]
      summary: Geschäftsjahre
      x-kumero-recht: kern.stammdaten.sehen
      responses:
        '200':
          description: Geschäftsjahre nach Beginn
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Geschaeftsjahr' } }
    post:
      tags: [Geschäftsjahre]
      summary: Geschäftsjahr anlegen
      description: Beginn und Ende frei; lückenlos und ohne Überschneidung (F65).
      x-kumero-recht: kern.geschaeftsjahr.anlegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kennung, beginn, ende]
              properties:
                kennung: { type: string, examples: ['2027'] }
                beginn: { type: string, format: date }
                ende: { type: string, format: date }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Geschaeftsjahr' }
        '422': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/geschaeftsjahre/{geschaeftsjahr}/sperren:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { $ref: '#/components/parameters/geschaeftsjahr' }
    post:
      tags: [Geschäftsjahre]
      summary: Geschäftsjahr sperren (Jahresabschluss, F33)
      description: |
        Vorher `POST /freigaben/challenge` mit `art: gj_sperren`. Module mit Beitrag zur
        Jahressperre (F75 Nr. 11) liefern ihren Beitrag in derselben Transaktion; fehlt einer, 409 `KM003`.
      x-kumero-recht: kern.geschaeftsjahr.sperren
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FreigabeNachweis' }
      responses:
        '200':
          description: Gesperrt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Geschaeftsjahr' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/geschaeftsjahre/{geschaeftsjahr}/oeffnen:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { $ref: '#/components/parameters/geschaeftsjahr' }
    post:
      tags: [Geschäftsjahre]
      summary: Gesperrtes Geschäftsjahr wieder öffnen (Notfall, F36)
      x-kumero-recht: kern.geschaeftsjahr.oeffnen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FreigabeNachweis'
                - type: object
                  required: [begruendung]
                  properties:
                    begruendung: { type: string, minLength: 10 }
      responses:
        '200':
          description: Wieder offen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Geschaeftsjahr' }

  # ===========================================================================
  # Buchungen (B3)
  # ===========================================================================
  /m/{mandant}/api/v1/buchungen:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Buchungen]
      summary: Journal und Entwürfe
      description: Festgeschriebene nach Journalnummer, Entwürfe nach Erfassungszeit.
      x-kumero-recht: kern.buchung.sehen
      parameters:
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/Buchungsstatus' } }, style: form, explode: false }
        - { name: von, in: query, description: Buchungsdatum ab, schema: { type: string, format: date } }
        - { name: bis, in: query, description: Buchungsdatum bis, schema: { type: string, format: date } }
        - { name: konto, in: query, schema: { type: string } }
        - { name: buchungsart, in: query, schema: { type: string } }
        - { name: erfasst_von, in: query, description: 'z. B. Stapel eines Erfassers', schema: { type: string } }
        - { name: reihenfolge, in: query, description: 'auf = älteste zuerst (Standard), ab = neueste zuerst', schema: { enum: [auf, ab], default: auf } }
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/anzahl' }
      responses:
        '200':
          description: Seite
          content:
            application/json:
              schema:
                type: object
                required: [eintraege]
                properties:
                  eintraege: { type: array, items: { $ref: '#/components/schemas/Buchung' } }
                  weiter: { type: [string, 'null'], description: Cursor der nächsten Seite }
    post:
      tags: [Buchungen]
      summary: Entwurf anlegen
      description: |
        Entwürfe dürfen unvollständig sein (F62). Mit `vorbereiten: true` wird der Entwurf in
        derselben Transaktion vorbereitet (F66); die Antwort enthält dann den Freigabe-Hash.
        So bucht ein Buchhalter mit zwei Aufrufen: anlegen + vorbereiten, dann freigeben (F31).
      x-kumero-recht: kern.entwurf.anlegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BuchungInhalt'
                - type: object
                  properties:
                    vorbereiten: { type: boolean, default: false }
      responses:
        '201':
          description: Angelegt
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Buchung' }
        '422': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/buchungen/{id}:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { $ref: '#/components/parameters/buchung' }
    get:
      tags: [Buchungen]
      summary: Buchung oder Entwurf lesen
      x-kumero-recht: kern.buchung.sehen
      responses:
        '200':
          description: Buchung
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Buchung' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Buchungen]
      summary: Entwurf ersetzen
      description: Nur Entwürfe (F20, F31). Ein freigabebereiter Entwurf fällt dabei auf `entwurf` zurück (F66).
      x-kumero-recht: kern.entwurf.aendern
      parameters:
        - { $ref: '#/components/parameters/idempotenz' }
        - { $ref: '#/components/parameters/ifMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuchungInhalt' }
      responses:
        '200':
          description: Ersetzt
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Buchung' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Buchungen]
      summary: Entwurf löschen
      x-kumero-recht: kern.entwurf.loeschen
      parameters:
        - { $ref: '#/components/parameters/idempotenz' }
        - { $ref: '#/components/parameters/ifMatch' }
      responses:
        '204': { description: Gelöscht (im Protokoll mit Vorher-Stand) }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/buchungen/{id}/vorbereiten:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { $ref: '#/components/parameters/buchung' }
    post:
      tags: [Buchungen]
      summary: Entwurf vorbereiten (F66)
      description: Prüft alle Regeln, lässt Module anreichern und friert den Inhalt ein.
      x-kumero-recht: kern.entwurf.aendern
      parameters:
        - { $ref: '#/components/parameters/idempotenz' }
        - { $ref: '#/components/parameters/ifMatch' }
      responses:
        '200':
          description: Freigabebereit
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Buchung' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/buchungen/{id}/zuruecksetzen:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { $ref: '#/components/parameters/buchung' }
    post:
      tags: [Buchungen]
      summary: Freigabebereit → Entwurf
      x-kumero-recht: kern.entwurf.aendern
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '200':
          description: Wieder Entwurf
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Buchung' }
  /m/{mandant}/api/v1/buchungen/{id}/storno:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { $ref: '#/components/parameters/buchung' }
    post:
      tags: [Buchungen]
      summary: Storno als Entwurf anlegen (F30)
      description: |
        Legt einen Entwurf mit getauschten Seiten an. Festgeschrieben wird er wie jede Buchung
        über `vorbereiten` und `POST /freigaben`; dafür braucht es `kern.buchung.stornieren`.
      x-kumero-recht: kern.storno.vorschlagen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                buchungsdatum: { type: string, format: date, description: 'Standard: heute (F30)' }
                text: { type: string }
      responses:
        '201':
          description: Storno-Entwurf
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Buchung' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/buchungen/{id}/belege:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { $ref: '#/components/parameters/buchung' }
    post:
      tags: [Buchungen]
      summary: Beleg nachreichen (F27)
      x-kumero-recht: kern.beleg.nachreichen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Belegverweis' }
      responses:
        '201': { description: Nachgereicht (eigenes Kettenereignis, Buchung unverändert) }

  # ===========================================================================
  # Freigabe (F38, F66–F68)
  # ===========================================================================
  /m/{mandant}/api/v1/freigaben/challenge:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    post:
      tags: [Freigabe]
      summary: Challenge für eine Freigabe ausstellen
      description: |
        Liefert den Inhalt, den die Oberfläche **genau so** anzeigen muss (F38), seinen Hash
        und die WebAuthn-Optionen. Die Challenge ist 5 Minuten gültig und nur einmal verwendbar (F68).
      x-kumero-recht: 'je nach Art: kern.buchung.festschreiben, bei Stornos kern.buchung.stornieren (F78 O2), kern.geschaeftsjahr.sperren, …'
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [art, buchungen]
                  properties:
                    art: { const: festschreibung }
                    buchungen: { type: array, minItems: 1, items: { type: string, format: uuid }, description: Reihenfolge = Stapelliste (F67) }
                - type: object
                  required: [art, geschaeftsjahr]
                  properties:
                    art: { enum: [gj_sperren, gj_oeffnen] }
                    geschaeftsjahr: { type: string }
                    begruendung: { type: string, description: nur bei gj_oeffnen }
      responses:
        '201':
          description: Challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreigabeChallenge' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '501': { description: 'gj_sperren und gj_oeffnen sind noch nicht umgesetzt (`nicht_umgesetzt`)' }
  /m/{mandant}/api/v1/freigaben:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    post:
      tags: [Freigabe]
      summary: Buchungen freigeben und festschreiben (einzeln oder als Stapel)
      description: |
        Stornos und andere Buchungen werden getrennt freigegeben. Mit `assertion` prüft die Anwendung die
        WebAuthn-Signatur über die Challenge (F68); Bindung an Subjekt, Handlung und Inhalt prüft die Datenbank (F72).
      x-kumero-recht: 'kern.buchung.festschreiben, bei Stornos kern.buchung.stornieren (F78 O2)'
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FreigabeNachweis'
                - type: object
                  required: [buchungen]
                  properties:
                    buchungen: { type: array, minItems: 1, items: { type: string, format: uuid }, description: dieselbe Liste wie bei der Challenge }
      responses:
        '200':
          description: Festgeschrieben
          content:
            application/json:
              schema:
                type: object
                properties:
                  freigabe: { type: [string, 'null'], format: uuid, description: null im Testbetrieb ohne Assertion }
                  buchungen:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        journal_nr: { type: integer }
                        nr: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/passkeys:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Freigabe]
      summary: Eigene Freigabe-Passkeys in diesem Mandanten
      x-kumero-recht: kern.credential.verwalten
      responses:
        '200':
          description: Passkeys
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Passkey' } }
    post:
      tags: [Freigabe]
      summary: Freigabe-Passkey registrieren
      description: Zweistufig wie bei der Anmeldung; ohne `attestation` liefert der Aufruf die Optionen.
      x-kumero-recht: kern.credential.verwalten
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bezeichnung: { type: string }
                registrierung: { $ref: '#/components/schemas/WebauthnRegistrierung' }
      responses:
        '200':
          description: Optionen (erster Schritt)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebauthnErstellOptionen' }
        '201':
          description: Registriert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Passkey' }
  /m/{mandant}/api/v1/passkeys/{credential}:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { name: credential, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Freigabe]
      summary: Freigabe-Passkey widerrufen
      description: Frühere Freigaben bleiben gültig und prüfbar (F38).
      x-kumero-recht: kern.credential.verwalten
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '204': { description: Widerrufen }

  # ===========================================================================
  # Abfragen (B4)
  # ===========================================================================
  /m/{mandant}/api/v1/konten/{nr}/kontoblatt:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { name: nr, in: path, required: true, schema: { type: string } }
    get:
      tags: [Abfragen]
      summary: Kontoblatt
      x-kumero-recht: kern.buchung.sehen
      parameters:
        - { name: von, in: query, required: true, schema: { type: string, format: date } }
        - { name: bis, in: query, required: true, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/anzahl' }
      responses:
        '200':
          description: Anfangssaldo, Bewegungen, Endsaldo (nur festgeschriebene Buchungen)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Kontoblatt' }
  /m/{mandant}/api/v1/salden:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Abfragen]
      summary: Salden aller Konten zum Stichtag
      x-kumero-recht: kern.buchung.sehen
      parameters:
        - { name: stichtag, in: query, required: true, schema: { type: string, format: date } }
        - { name: geschaeftsjahr, in: query, description: nur Bewegungen dieses Jahres (ohne Vortrag), schema: { type: string } }
        - { name: konto, in: query, description: 'nur diese Konten: bis zu 200 Nummern, mit Komma getrennt', schema: { type: string } }
      responses:
        '200':
          description: Salden
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Saldo' } }

  /api/v1/oberflaeche/menue:
    get:
      tags: [Oberfläche]
      summary: Menü der Weboberfläche ohne Mandant (Bereiche start und verwaltung)
      description: OBERFLAECHE.md 4, F80. Sichtbar nur, was die Systemrechte des Subjekts erlauben; Ausblenden ist kein Schutz.
      x-kumero-recht: angemeldet
      responses:
        '200':
          description: Menü
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menue' }
  /m/{mandant}/api/v1/oberflaeche/menue:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Oberfläche]
      summary: Menü im Mandanten (alle Bereiche)
      description: Einträge des Kerns und der im Mandanten aktiven Module, gefiltert nach den Rollen des Subjekts (F80 N3), dazu die systemweiten Bereiche.
      responses:
        '200':
          description: Menü
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menue' }
  /api/v1/kontenrahmen/regelwerke:
    get:
      tags: [Kontenrahmen]
      summary: Regelwerke für die Kontoart (z. B. skr81)
      x-kumero-recht: verwaltung.verwalter
      responses:
        '200':
          description: Regelwerke
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties: { name: { type: string }, rahmen: { type: string }, version: { type: string }, beschreibung: { type: string } }
  /api/v1/kontenrahmen/entwuerfe:
    get:
      tags: [Kontenrahmen]
      summary: Offene Entwürfe des Imports (installationsweit, neueste zuerst; nach 14 Tagen entfernt)
      x-kumero-recht: verwaltung.verwalter
      responses:
        '200':
          description: Entwürfe ohne Kontenliste
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/KontenrahmenEntwurfKurz' } }
    post:
      tags: [Kontenrahmen]
      summary: Datei einlesen → Entwurf (DATEV-PDF oder CSV)
      description: Die Datei steht im Körper der Anfrage. Gespeichert wird nur das Leseergebnis und der SHA-256 der Datei, nicht die Datei selbst.
      x-kumero-recht: verwaltung.verwalter
      parameters:
        - { name: regelwerk, in: query, schema: { type: string, default: skr81 } }
        - { name: name, in: query, schema: { type: string, maxLength: 120 } }
      requestBody:
        required: true
        content:
          application/pdf: { schema: { type: string, format: binary } }
          text/csv: { schema: { type: string } }
      responses:
        '201':
          description: Entwurf mit Prüfbericht
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KontenrahmenEntwurf' }
        '400': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/kontenrahmen/entwuerfe/{id}:
    parameters: [ { $ref: '#/components/parameters/buchung' } ]
    get:
      tags: [Kontenrahmen]
      summary: Entwurf mit Prüfbericht und Konten
      x-kumero-recht: verwaltung.verwalter
      responses:
        '200':
          description: Entwurf
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KontenrahmenEntwurf' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Kontenrahmen]
      summary: Entwurf verwerfen
      x-kumero-recht: verwaltung.verwalter
      responses:
        '204': { description: Verworfen }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/kontenrahmen/entwuerfe/{id}/korrekturen:
    parameters: [ { $ref: '#/components/parameters/buchung' } ]
    put:
      tags: [Kontenrahmen]
      summary: Korrekturen setzen (ersetzt alle bisherigen)
      x-kumero-recht: verwaltung.verwalter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [korrekturen]
              properties:
                korrekturen:
                  type: object
                  description: Kontonummer → Korrektur
                  additionalProperties:
                    type: object
                    additionalProperties: false
                    properties:
                      kontoart: { $ref: '#/components/schemas/Kontoart' }
                      bezeichnung: { type: string, maxLength: 200 }
                      weglassen: { type: boolean }
      responses:
        '200':
          description: Entwurf neu berechnet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KontenrahmenEntwurf' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/kontenrahmen/entwuerfe/{id}/vorlage:
    parameters: [ { $ref: '#/components/parameters/buchung' } ]
    post:
      tags: [Kontenrahmen]
      summary: Entwurf als Vorlage speichern (nur ohne offene Punkte); der Entwurf wird danach entfernt
      x-kumero-recht: verwaltung.verwalter
      responses:
        '201':
          description: Vorlage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KontenrahmenVorlageKurz' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/kontenrahmen/vorlagen:
    get:
      tags: [Kontenrahmen]
      summary: Gespeicherte Vorlagen (installationsweit, K2)
      x-kumero-recht: verwaltung.verwalter
      responses:
        '200':
          description: Vorlagen
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/KontenrahmenVorlageKurz' } }
  /api/v1/kontenrahmen/vorlagen/{kennung}:
    parameters:
      - { name: kennung, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]{1,64}$' } }
    get:
      tags: [Kontenrahmen]
      summary: Vorlage mit Konten
      x-kumero-recht: verwaltung.verwalter
      responses:
        '200':
          description: Vorlage
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/KontenrahmenVorlageKurz' }
                  - type: object
                    properties:
                      konten: { type: array, items: { $ref: '#/components/schemas/KontenrahmenKonto' } }
                      ausgelassen: { type: array, items: { type: object } }
                      hinweise: { type: array, items: { type: object } }
                      quelle: { type: object }
                      regelwerk: { type: object }
        '404': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/kontenrahmen/vorlagen:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Kontenrahmen]
      summary: Vorlagen zur Auswahl im Mandanten
      x-kumero-recht: kontenrahmen.vorlage.anwenden
      responses:
        '200':
          description: Vorlagen
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/KontenrahmenVorlageKurz' } }
        '404': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/kontenrahmen/anwenden:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    post:
      tags: [Kontenrahmen]
      summary: Vorlage anwenden – fehlende Konten anlegen (F2, F74)
      x-kumero-recht: kontenrahmen.vorlage.anwenden
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vorlage]
              properties:
                vorlage: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
                bezeichnungen: { type: boolean, default: false, description: Bezeichnungen vorhandener Konten übernehmen }
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema:
                type: object
                properties:
                  angelegt: { type: integer }
                  vorhanden: { type: integer }
                  umbenannt: { type: integer }
                  konflikte: { type: array, items: { type: string } }
                  pruefen: { type: integer }
                  vorlage: { type: string }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/kontenrahmen/angewendet:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Kontenrahmen]
      summary: Vermerke angewendeter Kontenrahmen (F75 Nr. 6)
      x-kumero-recht: kontenrahmen.angewendet.sehen
      responses:
        '200':
          description: Vermerke, neueste zuerst
          content:
            application/json:
              schema: { type: array, items: { type: object } }

  # ===========================================================================
  # Modul arbeitsvorrat (ARBEITSVORRAT.md Abschnitt 8, F89) – nur wenn das Modul im Mandanten aktiv ist
  # ===========================================================================
  /m/{mandant}/api/v1/arbeitsvorrat/eintraege:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Arbeitsvorrat]
      summary: Einträge einer Ansicht, älteste zuerst (höchstens 500), mit Abgleich gegen Quellen und Buchungen
      x-kumero-recht: arbeitsvorrat.eintrag.sehen
      parameters:
        - { name: zustand, in: query, schema: { enum: [offen, in_arbeit, gebucht, verworfen], default: offen } }
        - { name: quelle, in: query, schema: { type: string } }
        - { name: art, in: query, schema: { type: string } }
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  eintraege: { type: array, items: { $ref: '#/components/schemas/VorratEintrag' } }
                  mehr: { type: boolean }
                  quellen: { type: array, items: { type: object, properties: { name: { type: string }, titel: { type: string } } } }
                  quellen_ausgefallen: { type: array, items: { type: string } }
    post:
      tags: [Arbeitsvorrat]
      summary: Eintrag von Hand anlegen (W9)
      x-kumero-recht: arbeitsvorrat.eintrag.anlegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VorratVorschlag' }
      responses:
        '201':
          description: Eintrag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VorratEintrag' }
        '400': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/arbeitsvorrat/eintraege/{id}:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Arbeitsvorrat]
      summary: Eintrag mit Beiträgen der Quellen und Vorbelegung aus den Regeln
      x-kumero-recht: arbeitsvorrat.eintrag.sehen
      responses:
        '200':
          description: Eintrag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VorratEintrag' }
        '404': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/arbeitsvorrat/eintraege/{id}/buchung:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Arbeitsvorrat]
      summary: Entwurf mit dem Eintrag verknüpfen, das bestätigte Konto der Gegenpartei wird gemerkt
      x-kumero-recht: arbeitsvorrat.eintrag.bearbeiten
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [buchung], additionalProperties: false, properties: { buchung: { type: string, format: uuid }, konto: { type: string } } }
      responses:
        '200':
          description: Eintrag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VorratEintrag' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/arbeitsvorrat/eintraege/{id}/verwerfen:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Arbeitsvorrat]
      summary: Offenen Eintrag mit Grund verwerfen (kein Buchungsfall)
      x-kumero-recht: arbeitsvorrat.eintrag.bearbeiten
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [grund], additionalProperties: false, properties: { grund: { type: string, maxLength: 300 } } }
      responses:
        '200':
          description: Eintrag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VorratEintrag' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/arbeitsvorrat/eintraege/{id}/oeffnen:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Arbeitsvorrat]
      summary: Verworfenen Eintrag wieder öffnen
      x-kumero-recht: arbeitsvorrat.eintrag.bearbeiten
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '200':
          description: Eintrag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VorratEintrag' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/arbeitsvorrat/zaehler:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Arbeitsvorrat]
      summary: Zahl der offenen Einträge (für das Menü, ohne Abgleich)
      x-kumero-recht: arbeitsvorrat.eintrag.sehen
      responses:
        '200':
          description: Zähler
          content:
            application/json:
              schema: { type: object, properties: { anzahl: { type: integer } } }
  /m/{mandant}/api/v1/arbeitsvorrat/regeln:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Arbeitsvorrat]
      summary: 'Regeln: Art → Geschäftsvorfall, Gegenpartei → Konto, bekannte Arten'
      x-kumero-recht: arbeitsvorrat.eintrag.sehen
      responses:
        '200':
          description: Regeln
          content:
            application/json:
              schema: { type: object, properties: { arten: { type: array, items: { type: object, properties: { art: { type: string }, vorlage: { type: string, format: uuid } } } }, gegenparteien: { type: array, items: { type: object, properties: { schluessel: { type: string }, gegenpartei: { type: string }, konto: { type: string }, geaendert_am: { type: string, format: date-time } } } }, bekannte_arten: { type: array, items: { type: string } } } }
  /m/{mandant}/api/v1/arbeitsvorrat/regeln/arten/{art}:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { name: art, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9_-]{0,39}$' } }
    put:
      tags: [Arbeitsvorrat]
      summary: Regel Art → Geschäftsvorfall setzen
      x-kumero-recht: arbeitsvorrat.regel.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [vorlage], additionalProperties: false, properties: { vorlage: { type: string, format: uuid } } }
      responses:
        '200':
          description: Regel
          content:
            application/json:
              schema: { type: object, properties: { art: { type: string }, vorlage: { type: string, format: uuid } } }
    delete:
      tags: [Arbeitsvorrat]
      summary: Regel löschen
      x-kumero-recht: arbeitsvorrat.regel.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '204': { description: Gelöscht }
        '404': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/arbeitsvorrat/regeln/gegenparteien/loeschen:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    post:
      tags: [Arbeitsvorrat]
      summary: Gemerktes Konto einer Gegenpartei löschen
      x-kumero-recht: arbeitsvorrat.regel.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [schluessel], additionalProperties: false, properties: { schluessel: { type: string } } }
      responses:
        '204': { description: Gelöscht }
        '404': { $ref: '#/components/responses/Problem' }
  # ===========================================================================
  # Belege aus angebundenen Belegarchiven (F97) – der Kern reicht an das zuständige DMS-Modul weiter
  # ===========================================================================
  /m/{mandant}/api/v1/belege/archive:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Buchungen]
      summary: Belegarchive des Nutzers – zuständig für alle Beleglinks, die mit dem Präfix beginnen
      x-kumero-recht: kern.buchung.sehen
      responses:
        '200':
          description: Archive
          content:
            application/json:
              schema: { type: array, items: { type: object, properties: { praefix: { type: string }, titel: { type: string }, bereit: { type: boolean }, modul: { type: string } } } }
  /m/{mandant}/api/v1/belege/vorschau:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Buchungen]
      summary: Vorschaubild eines Belegs, durchgereicht und nicht gespeichert
      x-kumero-recht: kern.buchung.sehen
      parameters:
        - { name: link, in: query, required: true, schema: { type: string }, description: Beleglink (F88) }
      responses:
        '200': { description: Bild, content: { image/png: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/belege/original:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Buchungen]
      summary: Originaldatei eines Belegs, durchgereicht und nicht gespeichert
      x-kumero-recht: kern.buchung.sehen
      parameters:
        - { name: link, in: query, required: true, schema: { type: string }, description: Beleglink (F88) }
      responses:
        '200': { description: Datei, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/belege/verweis:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    post:
      tags: [Buchungen]
      summary: Beleg am Original prüfen und den Belegverweis mit MD5 und SHA-256 liefern (F10, F88)
      x-kumero-recht: kern.buchung.sehen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [link], additionalProperties: false, properties: { link: { type: string } } }
      responses:
        '200':
          description: Geprüfter Belegverweis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Belegverweis' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/arbeitsvorrat/eintraege/vorauswahl:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    put:
      tags: [Arbeitsvorrat]
      summary: Vorauswahl von Konto, Gegenkonto und Buchungsart für einen oder viele offene Einträge (X1, X7) – Vorbelegung, keine Buchung
      x-kumero-recht: arbeitsvorrat.eintrag.bearbeiten
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [eintraege], additionalProperties: false, properties: { eintraege: { type: array, minItems: 1, maxItems: 500, items: { type: string, format: uuid } }, konto: { type: [string, 'null'] }, gegenkonto: { type: [string, 'null'] }, buchungsart: { type: [string, 'null'] } } }
      responses:
        '200':
          description: Zahl der geänderten Einträge
          content:
            application/json:
              schema: { type: object, properties: { geaendert: { type: integer } } }
        '422': { $ref: '#/components/responses/Problem' }
  # ===========================================================================
  # Modul paperless (PAPERLESS.md Abschnitt 5, F92) – nur wenn das Modul im Mandanten aktiv ist; nur für Nutzer, nicht für Dienstkonten
  # ===========================================================================
  /m/{mandant}/api/v1/paperless/verbindungen:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Paperless]
      summary: Eigene Verbindungen (ohne Token) und die Vorgabe des Mandanten
      x-kumero-recht: paperless.beleg.sehen
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema: { type: object, properties: { vorgabe: { type: [object, 'null'] }, verbindungen: { type: array, items: { $ref: '#/components/schemas/PaperlessVerbindung' } }, passphrase_min: { type: integer } } }
        '409': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Paperless]
      summary: Verbindung anlegen – das Token wird gegen Paperless geprüft, verschlüsselt gespeichert und gleich entsperrt
      x-kumero-recht: paperless.beleg.sehen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [adresse, token, passphrase], additionalProperties: false, properties: { adresse: { type: string }, bezeichnung: { type: string }, token: { type: string, writeOnly: true }, passphrase: { type: string, writeOnly: true, minLength: 10 }, tag_offen: { type: string } } }
      responses:
        '201':
          description: Ergebnis
          content:
            application/json:
              schema: { type: object, properties: { vorgabe: { type: [object, 'null'] }, verbindungen: { type: array, items: { $ref: '#/components/schemas/PaperlessVerbindung' } }, passphrase_min: { type: integer } } }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/paperless/verbindungen/{id}:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Paperless]
      summary: Bezeichnung und Tag für offene Belege ändern
      x-kumero-recht: paperless.beleg.sehen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { bezeichnung: { type: string }, tag_offen: { type: [string, 'null'] } } }
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema: { type: object, properties: { vorgabe: { type: [object, 'null'] }, verbindungen: { type: array, items: { $ref: '#/components/schemas/PaperlessVerbindung' } }, passphrase_min: { type: integer } } }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Paperless]
      summary: Verbindung samt Token löschen
      x-kumero-recht: paperless.beleg.sehen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '204': { description: Erledigt }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/paperless/verbindungen/{id}/status:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Paperless]
      summary: Verbindungstest – erreichbar, Version, Konto, Tag für offene Belege vorhanden
      x-kumero-recht: paperless.beleg.sehen
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema: { type: object, properties: { erreichbar: { type: boolean }, version: { type: [string, 'null'] }, konto: { type: [string, 'null'] }, tag_offen_vorhanden: { type: [boolean, 'null'] }, tags: { type: integer }, grund: { type: string }, status: { type: integer } } }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/paperless/verbindungen/{id}/tags:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Paperless]
      summary: Tags des eigenen Paperless-Kontos für das Auswahlfenster
      x-kumero-recht: paperless.beleg.sehen
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string }, uebernommen: { type: boolean }, arbeitstag: { type: boolean } } } }
        '409': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Paperless]
      summary: Gewählte Tags im Mandanten anlegen (zusätzlich kern.stammdaten.aendern)
      x-kumero-recht: paperless.beleg.sehen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [tags], additionalProperties: false, properties: { tags: { type: array, items: { type: integer } } } }
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema: { type: object, properties: { angelegt: { type: array, items: { type: string } }, uebergangen: { type: array, items: { type: string } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/paperless/entsperren:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    post:
      tags: [Paperless]
      summary: Mit der Passphrase für diese Sitzung entsperren – setzt das Cookie mit dem Sitzungsschlüssel
      x-kumero-recht: paperless.beleg.sehen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [passphrase], additionalProperties: false, properties: { passphrase: { type: string, writeOnly: true } } }
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema: { type: object, properties: { vorgabe: { type: [object, 'null'] }, verbindungen: { type: array, items: { $ref: '#/components/schemas/PaperlessVerbindung' } }, passphrase_min: { type: integer } } }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/paperless/sperren:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    post:
      tags: [Paperless]
      summary: Für diese Sitzung sperren
      x-kumero-recht: paperless.beleg.sehen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema: { type: object, properties: { vorgabe: { type: [object, 'null'] }, verbindungen: { type: array, items: { $ref: '#/components/schemas/PaperlessVerbindung' } }, passphrase_min: { type: integer } } }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/paperless/vorschau:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Paperless]
      summary: Vorschaubild eines Belegs
      x-kumero-recht: paperless.beleg.sehen
      parameters:
        - { name: link, in: query, required: true, schema: { type: string }, description: Beleglink eines eigenen Paperless }
      responses:
        '200':
          description: Durchgereicht, nicht gespeichert (Cache-Control no-store)
          content:
            image/png: { schema: { type: string, format: binary } }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/paperless/original:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Paperless]
      summary: Originaldatei eines Belegs
      x-kumero-recht: paperless.beleg.sehen
      parameters:
        - { name: link, in: query, required: true, schema: { type: string }, description: Beleglink eines eigenen Paperless }
      responses:
        '200':
          description: Durchgereicht, nicht gespeichert (Cache-Control no-store)
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/paperless/verweis:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    post:
      tags: [Paperless]
      summary: Belegverweis mit Prüfung – Original laden, MD5 und SHA-256 rechnen, MD5 gegen Paperless abgleichen (F10, F51 Nr. 4)
      x-kumero-recht: paperless.beleg.sehen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [link], additionalProperties: false, properties: { link: { type: string } } }
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Belegverweis' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/paperless/vorgabe:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    put:
      tags: [Paperless]
      summary: Adresse des Paperless für den Mandanten vorgeben; adresse null entfernt die Vorgabe
      x-kumero-recht: paperless.vorgabe.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [adresse], additionalProperties: false, properties: { adresse: { type: [string, 'null'] }, bezeichnung: { type: string } } }
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema: { type: object }
        '409': { $ref: '#/components/responses/Problem' }
  # ===========================================================================
  # Modul buchen (BUCHUNGSMASKE.md Abschnitt 3 und 5, F83) – nur wenn das Modul im Mandanten aktiv ist
  # ===========================================================================
  /m/{mandant}/api/v1/buchen/vorlagen:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Buchen]
      summary: Geschäftsvorfälle (Buchungsvorlagen), sortiert nach Reihenfolge, Gruppe, Name
      x-kumero-recht: buchen.vorlage.sehen
      responses:
        '200':
          description: Vorlagen
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BuchenVorlage' } }
    post:
      tags: [Buchen]
      summary: Vorlage anlegen
      x-kumero-recht: buchen.vorlage.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuchenVorlageInhalt' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuchenVorlage' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/buchen/vorlagen/vorgaben:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    post:
      tags: [Buchen]
      summary: Mitgelieferte allgemeine Vorlagen übernehmen
      description: Legt die mitgelieferten Vorlagen an, soweit es sie (Gruppe und Name) noch nicht gibt (M5).
      x-kumero-recht: buchen.vorlage.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema:
                type: object
                properties:
                  angelegt: { type: integer }
                  vorhanden: { type: integer }
  /m/{mandant}/api/v1/buchen/vorlagen/{id}:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Buchen]
      summary: Vorlage ersetzen
      x-kumero-recht: buchen.vorlage.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuchenVorlageInhalt' }
      responses:
        '200':
          description: Ersetzt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuchenVorlage' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Buchen]
      summary: Vorlage löschen
      x-kumero-recht: buchen.vorlage.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '204': { description: Gelöscht (im Protokoll mit Vorher-Stand) }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    sitzung:
      type: apiKey
      in: cookie
      name: __Host-kumero
    dienstkonto:
      type: http
      scheme: bearer
      bearerFormat: 'kmr_…'

  parameters:
    mandant:
      name: mandant
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$' }
    geschaeftsjahr:
      name: geschaeftsjahr
      in: path
      required: true
      description: Kennung, z. B. 2026
      schema: { type: string }
    buchung:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    idempotenz:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 255 }
    ifMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    cursor:
      name: cursor
      in: query
      schema: { type: string }
    anzahl:
      name: anzahl
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }

  headers:
    ETag:
      description: Stand eines Entwurfs; für If-Match (F19)
      schema: { type: string }

  responses:
    Problem:
      description: Fehler nach RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Dezimal:
      type: string
      pattern: '^[0-9]{1,13}\.[0-9]{2}$'
      description: Betrag in Buchwährung, immer positiv, genau zwei Nachkommastellen (F24)
      examples: ['119.00']
    Kurs:
      type: string
      pattern: '^[0-9]{1,9}\.[0-9]{6,10}$'
      description: Mengennotierung, Einheiten Fremdwährung je 1 Buchwährung (F12)
    Kontoart: { enum: [aktiv, passiv, aufwand, ertrag] }
    Buchungsstatus: { enum: [entwurf, freigabebereit, festgeschrieben] }

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, description: 'URN, z. B. urn:kumero:problem:KM002' }
        title: { type: string, description: übersetzt }
        status: { type: integer }
        code:
          type: string
          description: |
            Fester Code. Aus der Datenbank: KM001 Unveränderlichkeit (409), KM002 Buchungsregel (422),
            KM003 Zustand (409), KM004 kanonische Form (422), KM005 ETag (412), KM006 Idempotenz (409).
            Aus der Anwendung: anmeldung.erforderlich (401), recht.fehlt (403), mandant.unbekannt (404),
            nicht_gefunden (404), anfrage.ungueltig (400), webauthn.ungueltig (422),
            idempotenz.fehlt (400), etag.fehlt (428), modul.nicht_aktiv (404), nicht_umgesetzt (501),
            freigabe.nur_persoenlich (403, Dienstkonten geben nie frei, F78 O3),
            lesemodus (409), intern (500).
        detail: { type: string, description: übersetzte Meldung; nie Buchungsinhalte }
        instance: { type: string, description: Anfrage-ID }
        fehler:
          type: array
          description: bei anfrage.ungueltig je Feld
          items:
            type: object
            properties:
              feld: { type: string, examples: ['zeilen[1].betrag'] }
              meldung: { type: string }

    Ich:
      type: object
      properties:
        subjekt: { type: string, examples: ['nutzer:3f0c…'] }
        name: { type: string }
        sprache: { type: [string, 'null'], description: 'Sprache des Nutzers; null = wie der Browser (PROFIL.md U5)' }
        sprachen: { type: array, items: { type: string }, description: Wählbare Sprachen }
        einstellungen: { $ref: '#/components/schemas/Einstellungen' }
        verwalter: { type: boolean }
        mandanten:
          type: array
          items:
            type: object
            properties:
              kennung: { type: string }
              name: { type: string }
              betriebsart: { enum: [test, produktiv] }
              lesemodus: { type: boolean }

    PaperlessVerbindung:
      type: object
      description: Verbindung des Nutzers zu einem Paperless-ngx; das Token wird nie ausgegeben
      properties:
        id: { type: string, format: uuid }
        bezeichnung: { type: string }
        adresse: { type: string }
        tag_offen: { type: [string, 'null'] }
        entsperrt: { type: boolean }
        geaendert_am: { type: string, format: date-time }
    VorratVorschlag:
      type: object
      required: [betreff]
      additionalProperties: false
      description: Felder eines Eintrags, wie eine Quelle (oder der Nutzer von Hand) sie vorschlägt (ARBEITSVORRAT.md Abschnitt 2)
      properties:
        betreff: { type: string, maxLength: 200 }
        art: { type: string, pattern: '^[a-z][a-z0-9_-]{0,39}$', examples: [rechnung, kassenbon] }
        gegenpartei: { type: string, maxLength: 200 }
        gegenpartei_kennung: { type: string, maxLength: 60 }
        datum: { type: string, format: date }
        betrag: { type: string, pattern: '^\d{1,13}(\.\d{1,2})?$', description: 'immer positiv (F24)' }
        richtung: { enum: [ausgabe, einnahme] }
        belegnummer: { type: string, maxLength: 36 }
        zahlweise: { enum: [bar, unbar] }
        zahltag: { type: string, format: date }
        belege: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Belegverweis' } }
        hinweise: { type: array, maxItems: 30, items: { type: object, required: [text], properties: { feld: { type: string }, text: { type: string, maxLength: 300 } } } }
        notiz: { type: string, maxLength: 1000, description: Nur beim Anlegen von Hand }
    VorratEintrag:
      type: object
      properties:
        id: { type: string, format: uuid }
        zustand: { enum: [offen, in_arbeit, gebucht, verworfen] }
        betreff: { type: string }
        art: { type: [string, 'null'] }
        gegenpartei: { type: [string, 'null'] }
        gegenpartei_kennung: { type: [string, 'null'] }
        datum: { type: [string, 'null'], format: date }
        betrag: { type: [string, 'null'] }
        richtung: { enum: [ausgabe, einnahme, null] }
        belegnummer: { type: [string, 'null'] }
        zahlweise: { enum: [bar, unbar, null] }
        zahltag: { type: [string, 'null'], format: date }
        belege: { type: array, items: { $ref: '#/components/schemas/Belegverweis' } }
        hinweise: { type: array, items: { type: object } }
        vermerke: { type: array, items: { type: object, properties: { am: { type: string, format: date-time }, text: { type: string } } } }
        vor_konto: { type: [string, 'null'], description: Vorauswahl des Nutzers – Soll }
        vor_gegenkonto: { type: [string, 'null'], description: Vorauswahl des Nutzers – Haben }
        vor_buchungsart: { type: [string, 'null'] }
        verworfen_grund: { type: [string, 'null'] }
        eingegangen_am: { type: string, format: date-time }
        erledigt_am: { type: [string, 'null'], format: date-time }
        erledigt_von: { type: [string, 'null'] }
        quellen: { type: array, items: { type: string } }
        buchungen: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, stand: { enum: [entwurf, festgeschrieben, storniert] } } } }
        beitraege: { type: array, description: Nur beim Lesen eines Eintrags, items: { type: object } }
        vorbelegung: { type: object, description: Nur beim Lesen eines Eintrags, properties: { vorlage: { type: [string, 'null'], format: uuid }, konto_gegenpartei: { type: [string, 'null'] } } }

    Einstellungen:
      type: object
      description: Einstellungen des Nutzers, Schlüssel mit Namensraum (PROFIL.md Abschnitt 3)
      additionalProperties: false
      properties:
        kern.betragseingabe: { enum: [dezimal, kaufmaennisch, null] }
        kern.schriftgroesse: { enum: [normal, gross, sehr_gross, null] }
        kern.kontrast: { enum: [system, normal, hoch, null] }

    Konto:
      type: object
      required: [nr, bezeichnung, kontoart, aktiv, bebucht]
      properties:
        nr: { type: string, examples: ['4930'] }
        bezeichnung: { type: string }
        kontoart: { $ref: '#/components/schemas/Kontoart' }
        aktiv: { type: boolean }
        bebucht: { type: boolean, description: true = Nummer und Kontoart fest (F74) }
    KontoNeu:
      type: object
      required: [nr, bezeichnung, kontoart]
      properties:
        nr: { type: string }
        bezeichnung: { type: string }
        kontoart: { $ref: '#/components/schemas/Kontoart' }
    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        herkunft: { enum: [manuell, paperless] }
        paperless_id: { type: [integer, 'null'] }
    Nummernkreis:
      type: object
      properties:
        kuerzel: { type: string }
        bezeichnung: { type: string }
        jahre:
          type: array
          items:
            type: object
            properties:
              geschaeftsjahr: { type: string }
              vorlage: { type: string }
              zuruecksetzen: { type: boolean }
              zaehler: { type: [integer, 'null'] }
    Buchungsart:
      type: object
      required: [kuerzel, bezeichnung, nummernkreis]
      properties:
        kuerzel: { type: string, examples: ['ER'] }
        bezeichnung: { type: string, examples: ['Eingangsrechnung'] }
        nummernkreis: { type: string, description: Kürzel des Standardkreises }
    Geschaeftsjahr:
      type: object
      properties:
        kennung: { type: string }
        beginn: { type: string, format: date }
        ende: { type: string, format: date }
        status: { enum: [offen, gesperrt] }

    Belegverweis:
      type: object
      required: [link]
      additionalProperties: false
      description: >-
        Verweis auf das Original im Belegarchiv (F10, F88): der ganze Link, dazu MD5 und SHA-256 des Originals.
        Die Prüfsummen dürfen gemeinsam fehlen (ungeprüfter Verweis); vorbereitet, festgeschrieben und
        nachgereicht wird das nur im Testbetrieb. Altbestand vor 0.7.2 trägt beim Lesen `paperless_id` statt `link`.
      properties:
        link: { type: string, maxLength: 500, pattern: '^https?://[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]{1,5})?(/[^\s?#]*)?$', examples: ['https://paperless.example.org/documents/5210/'] }
        md5: { type: [string, 'null'], pattern: '^[0-9a-f]{32}$' }
        sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
    Zeile:
      type: object
      description: In Entwürfen dürfen Felder fehlen (F62); beim Vorbereiten gelten alle Regeln.
      properties:
        konto: { type: string }
        seite: { enum: [S, H] }
        betrag: { $ref: '#/components/schemas/Dezimal' }
        fw_betrag: { type: string, description: 'mit den Nachkommastellen der Währung (F12)' }
        fw_waehrung: { type: string, pattern: '^[A-Z]{3}$' }
        kurs: { $ref: '#/components/schemas/Kurs' }
        kurs_datum: { type: string, format: date }
        kurs_art: { type: string, examples: [tageskurs_bank, ezb_referenz, bmf_ust_monat] }
        tags: { type: array, items: { type: string }, description: Tag-Namen }
        erweiterung: { type: object, additionalProperties: true, description: 'Erweiterungswerte, z. B. {"steuer.schluessel": "VSt19"} (F58)' }
    BuchungInhalt:
      type: object
      properties:
        buchungsart: { type: string, description: Kürzel }
        nummernkreis: { type: string, description: 'Kürzel; Standard: Kreis der Buchungsart' }
        belegdatum: { type: string, format: date }
        buchungsdatum: { type: string, format: date, description: bestimmt das Geschäftsjahr }
        belegnummer: { type: string }
        text: { type: string }
        erweiterung: { type: object, additionalProperties: true }
        belege: { type: array, items: { $ref: '#/components/schemas/Belegverweis' } }
        zeilen: { type: array, items: { $ref: '#/components/schemas/Zeile' } }
    Buchung:
      allOf:
        - $ref: '#/components/schemas/BuchungInhalt'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/Buchungsstatus' }
            herkunft: { enum: [manuell, api, import, bank] }
            storno_von: { type: [string, 'null'], format: uuid }
            storniert_durch: { type: [string, 'null'], format: uuid }
            erfasst_am: { type: string, format: date-time }
            erfasst_von: { type: string }
            freigabe_hash: { type: [string, 'null'], description: ab freigabebereit (F66) }
            journal_nr: { type: [integer, 'null'] }
            nr: { type: [string, 'null'] }
            festgeschrieben_am: { type: [string, 'null'], format: date-time }
            festgeschrieben_von: { type: [string, 'null'] }
            testbetrieb: { type: boolean, description: ohne Freigabe-Signatur festgeschrieben (F59) }
            hash: { type: [string, 'null'] }
            summe: { $ref: '#/components/schemas/Dezimal', description: Σ Soll }

    Kontoblatt:
      type: object
      properties:
        konto: { $ref: '#/components/schemas/Konto' }
        von: { type: string, format: date }
        bis: { type: string, format: date }
        anfangssaldo: { $ref: '#/components/schemas/Saldobetrag' }
        endsaldo: { $ref: '#/components/schemas/Saldobetrag' }
        bewegungen:
          type: array
          items:
            type: object
            properties:
              buchung: { type: string, format: uuid }
              journal_nr: { type: integer }
              nr: { type: string }
              buchungsdatum: { type: string, format: date }
              belegnummer: { type: string }
              text: { type: string }
              seite: { enum: [S, H] }
              betrag: { $ref: '#/components/schemas/Dezimal' }
              gegenkonten: { type: array, items: { type: string } }
        weiter: { type: [string, 'null'] }
    Saldobetrag:
      type: object
      description: Betrag positiv mit Seite, nie mit Vorzeichen (F24)
      properties:
        betrag: { $ref: '#/components/schemas/Dezimal' }
        seite: { enum: [S, H] }
    Saldo:
      type: object
      properties:
        konto: { type: string }
        bezeichnung: { type: string }
        kontoart: { $ref: '#/components/schemas/Kontoart' }
        soll: { $ref: '#/components/schemas/Dezimal' }
        haben: { $ref: '#/components/schemas/Dezimal' }
        saldo: { $ref: '#/components/schemas/Saldobetrag' }

    # --- WebAuthn (Felder base64url, wie in der WebAuthn-JSON-Darstellung) ---
    WebauthnAnfrageOptionen:
      type: object
      description: PublicKeyCredentialRequestOptionsJSON; userVerification immer "required" (F68)
      properties:
        challenge: { type: string }
        rpId: { type: string }
        timeout: { type: integer }
        userVerification: { const: required }
        allowCredentials:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { const: public-key }
    WebauthnErstellOptionen:
      type: object
      description: PublicKeyCredentialCreationOptionsJSON; nur ES256 (-7) und EdDSA (-8), Attestation "none" (E3)
      additionalProperties: true
    WebauthnAssertion:
      type: object
      required: [id, response]
      description: Ergebnis von navigator.credentials.get() als JSON
      properties:
        id: { type: string }
        response:
          type: object
          required: [authenticatorData, clientDataJSON, signature]
          properties:
            authenticatorData: { type: string }
            clientDataJSON: { type: string }
            signature: { type: string }
            userHandle: { type: [string, 'null'] }
    WebauthnRegistrierung:
      type: object
      required: [id, response]
      description: Ergebnis von navigator.credentials.create() als JSON
      properties:
        token: { type: string, description: Registrierungslink-Token (ohne Sitzung) }
        bezeichnung: { type: string }
        id: { type: string }
        response:
          type: object
          required: [attestationObject, clientDataJSON]
          properties:
            attestationObject: { type: string }
            clientDataJSON: { type: string }

    FreigabeChallenge:
      type: object
      properties:
        challenge_id: { type: string, format: uuid }
        art: { enum: [festschreibung, gj_sperren, gj_oeffnen] }
        inhalt:
          type: object
          description: |
            Genau das, was angezeigt werden muss und in den Inhalts-Hash eingeht: bei Festschreibung
            die Liste der Buchungen mit ihrem eingefrorenen Inhalt und Freigabe-Hash (F67),
            beim Geschäftsjahr der Sperrinhalt samt Beiträgen der Module (F75 Nr. 11).
        inhalt_hash: { type: string }
        ablauf: { type: string, format: date-time }
        optionen: { $ref: '#/components/schemas/WebauthnAnfrageOptionen' }
    FreigabeNachweis:
      type: object
      properties:
        challenge_id: { type: string, format: uuid, description: im Testbetrieb optional }
        assertion: { $ref: '#/components/schemas/WebauthnAssertion' }
    Passkey:
      type: object
      properties:
        credential: { type: string, description: Credential-ID base64url }
        bezeichnung: { type: string }
        algorithmus: { enum: [-7, -8] }
        registriert_am: { type: string, format: date-time }
        widerrufen_am: { type: [string, 'null'], format: date-time }
    Menue:
      type: object
      properties:
        bereiche:
          type: array
          items:
            type: object
            properties:
              id: { enum: [start, buchen, stammdaten, auswertungen, abschluss, einstellungen, verwaltung] }
              titel: { type: string }
              eintraege: { type: array, items: { $ref: '#/components/schemas/MenueEintrag' } }
        seiten:
          type: object
          description: '<modul>/<ziel> → URL der Seite (ES-Modul) und der Texte'
          additionalProperties:
            type: object
            properties: { url: { type: string }, texte: { type: [string, 'null'] } }
        mandant: { type: [string, 'null'] }
        rechte_system: { type: array, items: { type: string } }
        rechte_mandant: { type: array, items: { type: string } }
    MenueEintrag:
      type: object
      properties:
        id: { type: string }
        titel: { type: string }
        pfad: { type: string, description: 'z. B. #/m/praxis/kern/konten' }
        symbol: { type: [string, 'null'] }
        zaehler: { type: [string, 'null'] }
        unter: { type: array, items: { $ref: '#/components/schemas/MenueEintrag' } }
    KontenrahmenBericht:
      type: object
      properties:
        konten: { type: integer }
        bereiche: { type: integer }
        ausgelassen: { type: integer }
        pruefen: { type: integer, description: Kontoart aus unsicherem Bereich, zu bestätigen }
        offen: { type: integer, description: verhindern das Speichern }
        hinweise: { type: integer }
        kontoarten: { type: object, additionalProperties: { type: integer } }
        bereit: { type: boolean }
    KontenrahmenKonto:
      type: object
      properties:
        nr: { type: string }
        bezeichnung: { type: string }
        kontoart: { type: [string, 'null'] }
        kontoart_herkunft: { enum: [quelle, posten, regel, hand] }
        posten: { type: string, description: Bilanz- oder GuV-Posten laut Kontenrahmen (F81) }
        programmverbindung: { type: string }
        kennzeichen: { type: string }
        fussnote: { type: string }
        pruefen: { type: string }
        offen: { type: string }
    KontenrahmenEntwurfKurz:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        rahmen: { type: string }
        art: { enum: [pdf, csv] }
        angelegt_am: { type: string, format: date-time }
        angelegt_von: { type: string }
        geaendert_am: { type: [string, 'null'], format: date-time }
        bericht: { $ref: '#/components/schemas/KontenrahmenBericht' }
    KontenrahmenEntwurf:
      allOf:
        - { $ref: '#/components/schemas/KontenrahmenEntwurfKurz' }
        - type: object
          properties:
            fassung: { type: [string, 'null'] }
            regelwerk: { type: object }
            quelle: { type: object }
            konten: { type: array, items: { $ref: '#/components/schemas/KontenrahmenKonto' } }
            ausgelassen: { type: array, items: { type: object } }
            hinweise: { type: array, items: { type: object } }
            bereiche: { type: array, items: { type: object } }
            korrekturen: { type: object }
    KontenrahmenVorlageKurz:
      type: object
      properties:
        kennung: { type: string }
        name: { type: string }
        rahmen: { type: string }
        fassung: { type: [string, 'null'] }
        quelle_art: { type: string }
        eingelesen_am: { type: string, format: date-time }
        sha256: { type: string }
        bericht: { $ref: '#/components/schemas/KontenrahmenBericht' }
    BuchenVorlageInhalt:
      type: object
      required: [gruppe, name]
      description: |
        Geschäftsvorfall: belegt das Formular der Buchungserfassung vor – Daten, keine Logik. Konto, Gegenkonto,
        Buchungsart und Tags stehen als Nummer, Kürzel und Name darin; ob es sie gibt, prüft der Kern beim Buchen.
      properties:
        gruppe: { type: string, maxLength: 60, examples: ['Zahlungseingang'] }
        name: { type: string, maxLength: 100, description: je Gruppe eindeutig }
        konto: { type: [string, 'null'], description: steht im Soll }
        gegenkonto: { type: [string, 'null'], description: steht im Haben }
        buchungsart: { type: [string, 'null'], description: Kürzel }
        text: { type: [string, 'null'], maxLength: 500 }
        tags: { type: array, maxItems: 20, items: { type: string } }
        reihenfolge: { type: integer, minimum: 0, maximum: 100000, default: 100 }
    BuchenVorlage:
      allOf:
        - { $ref: '#/components/schemas/BuchenVorlageInhalt' }
        - type: object
          properties:
            id: { type: string, format: uuid }
