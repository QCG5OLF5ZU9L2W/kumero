# kumero – Zugang über SSH-Tunnel für Test und Entwicklung (ENTWICKLUNG_TUNNEL=ja)
# Lauscht nur auf 127.0.0.1, also nur über den Tunnel erreichbar:
#   ssh -L 8080:127.0.0.1:8080 root@<server>   →   http://localhost:8080
server {
    listen 127.0.0.1:8080;
    server_name localhost;

    root @KUMERO_VERZ@/public;
    index index.php;
    # Wie die Grenze des Moduls import für CSV und CAMT (350 MB, IMPORT.md Abschnitt 18, F117).
    # Wird die Grenze dort geändert, hier mitziehen.
    client_max_body_size 350m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Strenge CSP (F80 N5): nur eigene Quellen, kein Inline-Skript, auch nicht für Module
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    access_log /var/log/nginx/kumero-tunnel.access.log;
    error_log  /var/log/nginx/kumero-tunnel.error.log;

    # Seiten der Module aus dem signierten Release (OBERFLAECHE.md 5, F80 N5):
    # /module/<name>/<version>/<datei> → module/<name>/oeffentlich/<datei>
    location ~ "^/module/([a-z][a-z0-9-]*)/[0-9]+\.[0-9]+\.[0-9]+/([a-z0-9_/-]+\.(js|css|json|svg))$" {
        alias @KUMERO_VERZ@/module/$1/oeffentlich/$2;
        expires 7d;
    }

    location / {
        # Rahmen und Bausteine des Kerns (/app.html, /kern/…) haben keine Version im Pfad: Der Browser fragt jedes Mal nach,
        # ob sie sich geändert haben (304, wenn nicht). Sonst liefe nach einem Update alter Kern mit neuen Modulseiten.
        expires -1;
        try_files $uri /index.php$is_args$args;
    }
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php@PHP_VERSION@-fpm-kumero.sock;
        internal;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
