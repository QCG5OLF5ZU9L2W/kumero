# ENTWURF – nicht gebaut. Endpunkte der Ebene Mandant für „mehrere Bücher je Mandant“ (BUECHER.md Abschnitt 8, F123).
# Der gültige Vertrag ist openapi/v1.yaml; er wird zusammen mit dem Code umgestellt (BUECHER.md Stufe B).
# Für alle übrigen Pfade gilt die Regel aus BUECHER.md Abschnitt 8:
#   /m/{mandant}/api/v1/X  →  /m/{mandant}/b/{buch}/api/v1/X   (Methoden, Felder, Rechte und Fehlercodes unverändert)
openapi: 3.1.0
info:
  title: kumero – Entwurf Bücher
  version: 0.0.0-entwurf
  license: { name: AGPL-3.0-or-later, identifier: AGPL-3.0-or-later }
paths:
  /m/{mandant}/api/v1/buecher:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      summary: Bücher des Mandanten, in die der Nutzer hineindarf; der Administrator sieht alle, ohne Inhalt
      x-kumero-recht: angemeldet
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema: { type: object, properties: { buecher: { type: array, items: { $ref: '#/components/schemas/Buch' } } } }
    post:
      summary: Buch anlegen – als Auftrag an den Dienst (wie „Mandant anlegen“, F118)
      x-kumero-recht: mandant.administrator
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kennung, name, art]
              additionalProperties: false
              properties:
                kennung: { type: string, pattern: '^[a-z][a-z0-9-]{1,19}$' }
                name: { type: string, maxLength: 100 }
                art: { type: string, enum: [euer, bilanz], description: Art der Gewinnermittlung (B4) }
                buchwaehrung: { type: string, pattern: '^[A-Z]{3}$', default: EUR }
                testbuch: { type: boolean, default: false, description: Unveränderlich; ein Testbuch wird nie produktiv (B6) }
      responses:
        '202': { description: Auftrag angenommen, content: { application/json: { schema: { $ref: '#/components/schemas/Auftrag' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/buecher/{buch}:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    patch:
      summary: Namen des Buchs ändern (die Kennung ist fest)
      x-kumero-recht: mandant.administrator
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], additionalProperties: false, properties: { name: { type: string, maxLength: 100 } } }
      responses:
        '204': { description: Geändert }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Testbuch löschen – Stufe D, erst nach der Entscheidung zu O2
      x-kumero-recht: mandant.administrator
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '202': { description: Auftrag angenommen }
        '409': { description: Kein Testbuch, content: { application/problem+json: { schema: { type: object } } } }
  /m/{mandant}/api/v1/buecher/{buch}/kopie:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    post:
      summary: Übernahme – Kopie dieses Buchs in ein neues Testbuch desselben Mandanten (B7); Stufe D
      description: >
        Die Kopie bekommt eine neue Kennung und den Vermerk „Kopie von … Stand …“. Siegel und Wasserstandsmarke der
        Kopie gelten nicht als echte. Nie über Mandantengrenzen.
      x-kumero-recht: mandant.administrator
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kennung, name]
              additionalProperties: false
              properties:
                kennung: { type: string, pattern: '^[a-z][a-z0-9-]{1,19}$' }
                name: { type: string, maxLength: 100 }
      responses:
        '202': { description: Auftrag angenommen, content: { application/json: { schema: { $ref: '#/components/schemas/Auftrag' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/administratoren:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      summary: Administratoren des Mandanten
      x-kumero-recht: mandant.administrator
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  administratoren:
                    type: array
                    items: { type: object, properties: { nutzer: { type: string, format: uuid }, seit: { type: string, format: date-time } } }
    post:
      summary: Einen Nutzer des Mandanten als Administrator einsetzen
      x-kumero-recht: mandant.administrator
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [nutzer], additionalProperties: false, properties: { nutzer: { type: string, format: uuid } } }
      responses:
        '201': { description: Eingesetzt }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/administratoren/{nutzer}:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { name: nutzer, in: path, required: true, schema: { type: string, format: uuid } } ]
    delete:
      summary: Administrator abberufen – der letzte bleibt (409 `KM003`)
      x-kumero-recht: mandant.administrator
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '204': { description: Abberufen }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/zuweisungen:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    get:
      summary: Nutzer des Mandanten mit ihren laufenden Rollen in diesem Buch; dazu die Rollen des Buchs zur Auswahl
      x-kumero-recht: kern.rechte.sehen
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  zuweisungen:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        nutzer: { type: string, format: uuid }
                        rolle: { type: string }
                        art: { type: string }
                        gueltig_von: { type: string, format: date-time }
                        gueltig_bis: { type: string, format: date-time, nullable: true }
                  rollen: { type: array, items: { type: object, properties: { name: { type: string }, art: { type: string }, beschreibung: { type: string, nullable: true } } } }
components:
  parameters:
    mandant: { name: mandant, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$' } }
    buch: { name: buch, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,19}$' } }
    idempotenz: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 255 } }
  responses:
    Problem:
      description: Fehler nach RFC 9457
      content: { application/problem+json: { schema: { type: object } } }
  schemas:
    Buch:
      type: object
      properties:
        kennung: { type: string }
        name: { type: string }
        art: { type: string, enum: [euer, bilanz] }
        testbuch: { type: boolean }
        betriebsart: { type: string, enum: [test, produktiv] }
        kopie_von: { type: string, nullable: true, description: Kennung des Buchs, aus dem dieses Testbuch übernommen wurde }
        kopie_stand: { type: string, format: date-time, nullable: true }
        zustand: { type: string, enum: [bereit, wird_angelegt], description: '`wird_angelegt`, solange der Auftrag läuft' }
        zugang: { type: boolean, description: Der Nutzer hat in diesem Buch eine laufende Rolle }
    Auftrag:
      type: object
      properties: { id: { type: string, format: uuid }, art: { type: string }, zustand: { type: string } }
