  # ===========================================================================
  # Belege aus angebundenen Belegarchiven (F97) – der Kern reicht an das zuständige DMS-Modul weiter
  # ===========================================================================
  /m/{mandant}/b/{buch}/api/v1/belege/archive:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    get:
      tags: [Buchungen]
