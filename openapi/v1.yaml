    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    post:
      tags: [Import]
      description: Bei CAMT enthält einstellungen das gewählte geldkonto als JSON-Objekt. Mehrdeutige Überschneidungen oder ungültige Bankdaten ergeben 422.
      summary: Neue Zeilen als Einträge in den Arbeitsvorrat einliefern; fehlerhafte Zeilen markiert, vorhandene übersprungen
      x-kumero-recht: import.datei.einlesen
      parameters:
        - { $ref: '#/components/parameters/idempotenz' }
        - { name: einstellungen, in: query, required: true, schema: { type: string } }
        - { name: name, in: query, schema: { type: string, description: Dateiname für den Bericht } }
        - { name: profil, in: query, schema: { type: string, description: Name des verwendeten Profils } }
      requestBody: { required: true, content: { text/csv: { schema: { type: string } }, application/xml: { schema: { type: string, description: Gebuchte EUR-Umsätze in camt.053 oder camt.054 (.001.02 oder .001.08) } } } }
      responses:
        '201': { description: Bericht mit der ID des Imports, content: { application/json: { schema: { $ref: '#/components/schemas/ImportBericht' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/import/rechnung/vorschau:
