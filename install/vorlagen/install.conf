# /etc/kumero/install.conf – Einstellungen für den kumero-Installer
# Änderungen werden beim nächsten Lauf von install.sh angewendet.

# PHP-Version aus packages.sury.org (F54: mindestens 8.5)
PHP_VERSION=8.5

# PostgreSQL-Hauptversion aus apt.postgresql.org (F54: mindestens 19)
PG_VERSION=19

# auto: stabile Pakete aus PGDG "main" verwenden; gibt es dort die Version
#       noch nicht, automatisch die Vorabversion (Beta/RC) nehmen.
#       Nach der stabilen Veröffentlichung reicht ein erneuter Lauf von
#       install.sh – die Vorab-Komponente wird dann wieder entfernt.
# ja / nein: fest vorgeben.
PG_VORABVERSION=auto

# Vollständiger Hostname, unter dem kumero erreichbar ist
#SERVERNAME=kumero.example.org

# TLS-Zertifikat von außen, z. B. vom ACME-Client der OPNsense per SFTP
# hochgeladen (Let's Encrypt). Verzeichnis mit fullchain.pem/cert.pem, ca.pem
# und key.pem (o. ä.). kumero-zertifikat prüft es (gültig, passt zu SERVERNAME,
# Schlüssel passt) und übernimmt es nach /etc/kumero/tls/ – automatisch bei
# jedem Upload und täglich. Leer = selbst signiertes Debian-Zertifikat.
#ZERTIFIKAT_QUELLE=/root/upload/kumero.example.org

# Zugang über einen SSH-Tunnel für Test und Entwicklung (ja/nein).
# Passkeys verlangen einen Hostnamen mit gültigem Zertifikat – oder
# http://localhost. Mit "ja" lauscht nginx zusätzlich nur lokal auf
# 127.0.0.1:8080 (ohne TLS) und die Anwendung erwartet http://localhost:8080.
# Vom Arbeitsplatz:  ssh -L 8080:127.0.0.1:8080 root@<server>
# dann im Browser:   http://localhost:8080
# Für den Betrieb "nein" und ein echtes Zertifikat für SERVERNAME.
ENTWICKLUNG_TUNNEL=nein

# Installationsverzeichnis der Anwendung (F56)
KUMERO_VERZ=/var/www/kumero

# Freigabe-Schlüssel (F73): öffentlicher OpenPGP-Schlüssel des
# Projektverantwortlichen (ASCII-Datei). Nur damit signierte Releases
# dürfen den installierten Kern ändern (install/aktualisieren.sh).
#FREIGABE_SCHLUESSEL=/root/freigabe.asc

# Automatische Updates (unattended-upgrades)
# Neustart nach Kernel-Updates automatisch durchführen? ja/nein
UPDATES_NEUSTART=nein
UPDATES_NEUSTART_ZEIT=03:30
# Bericht per Mail (leer = keine Mail; benötigt einen MTA)
UPDATES_MAIL=
