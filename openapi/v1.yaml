openapi: 3.1.0
info:
  title: kumero REST-API
  version: 1.0.0-entwurf.1
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  description: |
    **Entwurf 1, O1–O3 entschieden am 2026-11-17 (F78).** Vertrag vor dem Code (F18).
    Umfang dieses Entwurfs (ANWENDUNG.md E8 b): Anmeldung, Stammdaten,
    Geschäftsjahre, Buchungen mit Freigabe, Abfragen Kontoblatt und Salden.
    Rechte, Webhooks, Protokoll und Siegel folgen in einem zweiten Entwurf.

    **Seit kumero 0.7.30 (F126) – mehrere Bücher je Mandant, drei Ebenen:** Installation `/api/v1/…`, Mandant
    `/m/{mandant}/api/v1/…` (Nutzer, Administratoren, Bücher), Buch `/m/{mandant}/b/{buch}/api/v1/…` (alles, was eine
    Buchhaltung ausmacht: Stammdaten, Buchungen, Rollen, Module, Siegel). Alle bisherigen Mandantenpfade außer `/nutzer…`
    liegen jetzt im Buch – Methoden, Felder und Fehlercodes unverändert. Neu: `/buecher`, `/administratoren`,
    `GET …/b/{buch}/api/v1/zuweisungen`. Nutzer pflegt, wer Administrator des Mandanten ist (`mandant.administrator`);
    das ist ein Amt im Mandanten, keine Rolle eines Buchs. `Ich.mandanten` nennt weder Betriebsart noch Lesemodus – beides
    gehört zum Buch. Ein Siegel nennt in Fassung 2 Mandant und Buch.
    **Seit kumero 0.7.42 (F135)**: Module können zum Mandanten gehören (`ebene: mandant` im Manifest). Ihre Endpunkte liegen unter
    `/m/{mandant}/api/v1/<modul>/…`, ihre Rechte kommen aus Rollen am Mandanten: `/m/{mandant}/api/v1/zuweisungen` (nur Administrator).
    Der Administrator hat selbst keines dieser Rechte.
    **Seit kumero 0.7.26 (F120)**: Endpunkte des Moduls `siegel` – Siegel auf Anforderung, Signatur außerhalb, Prüfung beim Hochladen.
    **Seit kumero 0.7.29 (F125)**: Nutzer und Rollen des Mandanten unter `/m/{mandant}/api/v1/nutzer…` und `/zuweisungen`; Zugang mit Link und Code (`/api/v1/registrierung/pruefen`, Feld `code`).
    **Seit kumero 0.7.28 (F124)**: Anfordern legt nur eine vorläufige Anforderung an; neu `POST /siegel/{id}/festschreiben` und `DELETE /siegel/{id}`. Erst das Festschreiben schreibt Siegel, Signatur und Protokolleintrag.
    **Seit kumero 0.7.22 (F114, F115)**: Nutzer gehören zum Mandanten. `POST /api/v1/anmeldung` verlangt `response.userHandle`
    (das Pseudonym aus dem Passkey) und führt in genau einen Mandanten; `Ich` nennt `mandant`, `vornamen`, `familienname`,
    `email`, `angaben_fehlen`; `PATCH /api/v1/ich` nimmt einmalig fehlende Angaben; das Token eines Registrierungslinks
    nennt den Mandanten. Eine Sitzung gilt nur für die Mandantenpfade ihres Mandanten.
    **Seit kumero 0.7.6 (F97, F96)**: `/belege/…` (Belegarchiv), `PUT /arbeitsvorrat/eintraege/vorauswahl`.
    **Seit kumero 0.7.7 (F95, X2)**: `GET/PUT /paperless/verbindungen/{id}/zuordnung`; Vorauswahl mit `steuerkonto`; Einträge mit `netto`, `steuer`, `vor_steuerkonto`.
    **Seit kumero 0.7.8 (F100)**: `POST /arbeitsvorrat/abgleich`; `GET /arbeitsvorrat/eintraege?abgleich=nein` liest ohne die Quellen zu fragen.
    **Seit kumero 0.7.4 (F92)**: Endpunkte des Moduls `paperless`.
    **Seit kumero 0.7.3 (F89)**: Endpunkte des Moduls `arbeitsvorrat`.
    **Seit kumero 0.7.2 (F88)**: Belegverweis mit `link` statt `paperless_id`; `belege_nachgereicht` an der Buchung.
    **Seit kumero 0.7.1 (F86)**: `PATCH /api/v1/ich`, `GET`/`PUT /api/v1/ich/einstellungen`.
    **Seit kumero 0.7.0 (F83)** sind Buchungen, Freigabe, Salden und Kontoblatt umgesetzt. Ergänzt wurden
    `reihenfolge` bei `GET /buchungen`, `konto` bei `GET /salden`, die Antwort 428 ohne `If-Match` und die
    Endpunkte des Moduls `buchen` (Geschäftsvorfälle). Noch nicht umgesetzt: `/passkeys`, Sperren und Öffnen
    von Geschäftsjahren (die Challenge dafür antwortet 501).

    Grundregeln (F19, ANWENDUNG.md Abschnitt 3):
    - Globale Pfade unter `/api/v1`, Mandantenpfade unter `/m/{mandant}/api/v1` (F39).
    - Anmeldung per Sitzungs-Cookie `__Host-kumero` (Passkey, E2) oder
      `Authorization: Bearer kmr_…` (Dienstkonto, nur für seinen Mandanten).
    - Eine Sitzung gehört zu genau einem Mandanten (F114): Auf `/m/{mandant}/…` gilt sie nur für diesen; jeder andere
      Mandant antwortet 404 `mandant.unbekannt`. Die Sitzung eines System-Verwalters gilt für keinen Mandantenpfad.
    - Jeder schreibende Aufruf (POST, PUT, PATCH, DELETE) im Mandanten verlangt
      `Idempotency-Key`. Eine Wiederholung liefert die gespeicherte Antwort mit
      `Idempotency-Replayed: true`; derselbe Schlüssel mit anderer Anfrage ergibt 409 (`KM006`).
    - Entwürfe tragen ein `ETag`; Ändern, Löschen und Vorbereiten verlangen `If-Match` (412 bei Abweichung, `KM005`;
      428 `etag.fehlt`, wenn der Kopf fehlt). `If-Match: *` gilt für jeden Stand.
    - Beträge und Kurse sind **Dezimal-Strings**, nie Zahlen (F19, F24): Betrag immer positiv, Seite `S`/`H`.
    - Datumsangaben `YYYY-MM-DD`, Zeitpunkte RFC 3339 in UTC.
    - Listen seitenweise per `cursor` (undurchsichtig) und `anzahl`; die Antwort nennt `weiter`.
    - Fehler als Problem Details (RFC 9457) mit festem `code` und übersetztem `title` (Sprache aus
      `Accept-Language` bzw. Nutzerprofil, T5). Server-Logs enthalten keine Buchungsinhalte.
    - Jede Operation nennt in `x-kumero-recht` das nötige Recht (F41); fehlt es, folgt 403.

    Freigabe per WebAuthn (F38, F66–F68) in drei Schritten:
    1. Gegenstand vorbereiten (Buchungen: `POST …/vorbereiten`; Geschäftsjahr: entfällt).
    2. `POST /freigaben/challenge` mit Art und Gegenstand → anzuzeigender Inhalt, Inhalts-Hash
       und die Optionen für `navigator.credentials.get()`.
    3. Ausführen (`POST /freigaben` bzw. `…/sperren`) mit Challenge-ID und Assertion.
    Im Testbetrieb (F59) darf die Assertion fehlen; die Buchung wird als Testbuchung gekennzeichnet.
servers:
  - url: https://kumero.example.org

tags:
  - name: Anmeldung
  - name: Stammdaten
  - name: Geschäftsjahre
  - name: Buchungen
  - name: Freigabe
  - name: Abfragen
  - name: Verwaltung
  - name: Nutzer
    description: Nutzer und Rollen eines Mandanten – Zugang mit Link und Code, sperren, Rollen zuweisen (VERWALTUNG.md Abschnitt 15, F125)
    description: Mandantenverwaltung des System-Verwalters (VERWALTUNG.md Abschnitt 14, F118)
  - name: Oberfläche
  - name: Kontenrahmen
    description: Modul kontenrahmen (KONTENRAHMEN.md, F80)
  - name: Import
    description: Modul import – CSV-Dateien als Quelle des Arbeitsvorrats (IMPORT.md)
  - name: Buchen
    description: Modul buchen – Geschäftsvorfälle als Vorlagen für die Buchungserfassung (BUCHUNGSMASKE.md, F83)
  - name: Paperless
    description: Modul paperless – eigener Zugang des Nutzers zu Paperless-ngx, Vorschau, geprüfter Belegverweis (PAPERLESS.md, F92)
  - name: Siegel
    description: Modul siegel – Siegel auf Anforderung, außerhalb signiert (PGP), Signatur hochgeladen und geprüft (SIEGEL.md, F119, F120)
  - name: Arbeitsvorrat
    description: Modul arbeitsvorrat – Posteingang der Buchhaltung, unabhängig von der Quelle (ARBEITSVORRAT.md, F89)

security:
  - sitzung: []
  - dienstkonto: []

paths:
  # ===========================================================================
  # Global
  # ===========================================================================
  /api/v1/anmeldung/optionen:
    post:
      tags: [Anmeldung]
      summary: Challenge für die Anmeldung mit Passkey
      security: []
      responses:
        '200':
          description: Optionen für navigator.credentials.get()
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebauthnAnfrageOptionen' }
  /api/v1/anmeldung:
    post:
      tags: [Anmeldung]
      summary: Mit Passkey anmelden
      description: |
        Prüft die Assertion (F68 sinngemäß, Art „anmeldung“) und setzt das Sitzungs-Cookie.
        **`response.userHandle` ist hier Pflicht** (F114 U1): Es trägt das Pseudonym der Identität (WebAuthn `user.id`,
        base64url). Die Verwaltungsdatenbank kennt dazu nur den Mandanten; geprüft wird der Passkey im Mandanten
        (System-Verwalter: in der Verwaltung). Unbekanntes Pseudonym, stillgelegter Mandant und ein Passkey, den das
        Ziel nicht kennt, antworten gleich mit 401 `webauthn.ungueltig`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebauthnAssertion' }
      responses:
        '200':
          description: Angemeldet
          headers:
            Set-Cookie: { schema: { type: string }, description: '`__Host-kumero=…; Secure; HttpOnly; SameSite=Strict; Path=/`' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ich' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/abmeldung:
    post:
      tags: [Anmeldung]
      summary: Sitzung beenden
      responses:
        '204': { description: Abgemeldet }
  /api/v1/ich:
    get:
      tags: [Anmeldung]
      summary: Eigenes Profil und der Mandant dieser Anmeldung (für System-Verwalter keiner)
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ich' }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Anmeldung]
      summary: Eigene Sprache setzen (seit 0.7.1, F86); null = wie der Browser. Nur Nutzer, keine Dienstkonten.
      description: |
        Seit 0.7.22 (F114 U6) zusätzlich: Solange `angaben_fehlen` gilt (überführter Bestand ohne E-Mail-Adresse), ergänzt
        der Nutzer **einmalig** Vorname(n), Familienname und E-Mail. Danach antwortet dieser Körper mit 409 (KM003) –
        Namen und Kontaktdaten ändert dann die Verwaltung des Mandanten (PROFIL.md U2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [sprache]
                  properties:
                    sprache: { type: [string, 'null'], examples: ['de'] }
                - type: object
                  additionalProperties: false
                  required: [vornamen, familienname, email]
                  properties:
                    vornamen: { type: string, maxLength: 200 }
                    familienname: { type: string, maxLength: 200 }
                    email: { type: string, format: email, maxLength: 254 }
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ich' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/ich/einstellungen:
    get:
      tags: [Anmeldung]
      summary: Wirksame eigene Einstellungen (gesetzte Werte, sonst Standard; seit 0.7.1, F86)
      responses:
        '200':
          description: Einstellungen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Einstellungen' }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Anmeldung]
      summary: Eigene Einstellungen setzen; nur genannte Schlüssel ändern sich, null stellt den Standard wieder her
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Einstellungen' }
      responses:
        '200':
          description: Wirksame Einstellungen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Einstellungen' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/registrierung/pruefen:
    post:
      tags: [Anmeldung]
      summary: Was ein Registrierungslink verlangt – ob ein Code dazugehört und bis wann er gilt
      description: Ohne Anmeldung. Zählt keine Fehlversuche und nennt die Person nicht. Ungültig, abgelaufen oder verbraucht → 403.
      security: [ {} ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '200':
          description: Der Link gilt
          content:
            application/json:
              schema:
                type: object
                properties:
                  code_noetig: { type: boolean }
                  gueltig_bis: { type: string, format: date-time, nullable: true }
                  mandant: { type: object, nullable: true, properties: { kennung: { type: string }, name: { type: string } } }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/registrierung/optionen:
    post:
      tags: [Anmeldung]
      summary: Passkey registrieren – Optionen
      description: |
        Mit `token` aus einem Registrierungslink (`bin/kumero nutzer:anlegen`, `mandant:anlegen`, `verwalter:anlegen`)
        ohne Anmeldung, sonst für den angemeldeten Nutzer selbst. Das Token nennt den Mandanten
        (`<kennung>.<zufall>`; ohne Kennung: System-Verwalter), damit die Seite ohne Anmeldung weiß, wohin (F114).
        `user.id` in der Antwort ist das Pseudonym der Identität, `user.name` nennt den Mandanten (U2);
        zusätzlich `mandant` (`kennung`, `name`) bzw. null für System-Verwalter.
      security: [ {}, { sitzung: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string, description: Registrierungslink-Token (nur ohne Sitzung) }
                code: { type: string, description: 'Der Code zum Link (VERWALTUNG.md Abschnitt 6), wenn der Zugang einen hat. Fehlt er: 403 `registrierung.code_fehlt` (kein Fehlversuch); falsch: 403 `registrierung.code_falsch` (gezählt); nach fünf falschen: 403 `registrierung.ungueltig`. Derselbe Code gehört auch in den abschließenden Aufruf.' }
      responses:
        '200':
          description: Optionen für navigator.credentials.create()
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebauthnErstellOptionen' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/registrierung:
    post:
      tags: [Anmeldung]
      summary: Passkey registrieren – abschließen
      security: [ {}, { sitzung: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebauthnRegistrierung' }
      responses:
        '201': { description: Passkey registriert }
        '422': { $ref: '#/components/responses/Problem' }

  # ===========================================================================
  # Nutzer und Rollen des Mandanten (VERWALTUNG.md Abschnitt 9 und 15, F125) – die Seite des Administrators
  # ===========================================================================
  /m/{mandant}/api/v1/nutzer:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Nutzer]
      summary: Nutzer des Mandanten mit Passkeys und offenem Zugang; `administrator` sagt, wer das Amt hat. Rollen stehen je Buch unter `…/b/{buch}/api/v1/zuweisungen`
      description: Die Liste nennt kein Pseudonym und keinen Schlüssel. `ich` ist die eigene Nutzer-ID.
      x-kumero-recht: mandant.administrator
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  nutzer: { type: array, items: { $ref: '#/components/schemas/Nutzer' } }
                  ich: { type: string, format: uuid, nullable: true }
    post:
      tags: [Nutzer]
      summary: Nutzer anlegen (Rollen bekommt er danach je Buch)
      description: >
        Die Identität entsteht im Mandanten; die Verwaltungsdatenbank bekommt nur die Zuordnung Pseudonym → Mandant (F114).
        Einen Zugang stellt `…/nutzer/{id}/zugang` aus.
      x-kumero-recht: mandant.administrator
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vornamen, familienname, email]
              additionalProperties: false
              properties:
                vornamen: { type: string, maxLength: 200 }
                familienname: { type: string, maxLength: 200 }
                email: { type: string, maxLength: 254 }
      responses:
        '201':
          description: Angelegt
          content: { application/json: { schema: { type: object, properties: { id: { type: string, format: uuid } } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/nutzer/{id}:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    patch:
      tags: [Nutzer]
      summary: Angaben ändern, sperren, entsperren – was fehlt, bleibt
      description: >
        Sperren beendet alle Sitzungen. Der letzte Administrator und der letzte Verantwortliche werden nicht gesperrt
        (409 `KM003`, VERWALTUNG.md Abschnitt 4) – das erzwingt die Datenbank.
      x-kumero-recht: mandant.administrator
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                vornamen: { type: string, maxLength: 200 }
                familienname: { type: string, maxLength: 200 }
                email: { type: string, maxLength: 254 }
                aktiv: { type: boolean }
      responses:
        '204': { description: Geändert }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/nutzer/{id}/zugang:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [Nutzer]
      summary: Zugang ausstellen – Link **und** Code, beide genau einmal in der Antwort
      description: >
        Mit Link und Code richtet die Person einmal einen Passkey ein (VERWALTUNG.md Abschnitt 6). Gespeichert sind nur
        Hashes; die Antwort wird auch im Idempotenzspeicher nicht abgelegt – eine Wiederholung derselben Anfrage ergibt
        409 `idempotenz.einmalig`. Der vorige Zugang derselben Identität wird ungültig. Gesperrte bekommen keinen (409).
      x-kumero-recht: mandant.administrator
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                stunden: { type: integer, minimum: 1, maximum: 24, default: 24 }
                passkeys_widerrufen: { type: boolean, default: false, description: Vorhandene Passkeys widerrufen (verlorener Passkey) }
      responses:
        '201':
          description: Ausgestellt
          content:
            application/json:
              schema:
                type: object
                properties:
                  link: { type: string, description: 'Adresse mit dem Token im Fragment: `…/app.html#registrierung=<mandant>.<zufall>`' }
                  code: { type: string, pattern: '^[A-HJKMNP-Z2-9]{6}$', description: Sechs Zeichen ohne verwechselbare; Groß-/Kleinschreibung beim Eintippen egal }
                  gueltig_bis: { type: string, format: date-time }
                  passkeys_widerrufen: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/nutzer/{id}/passkeys/{credential}:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: credential, in: path, required: true, schema: { type: string } } ]
    delete:
      tags: [Nutzer]
      summary: Passkey eines Nutzers widerrufen
      x-kumero-recht: mandant.administrator
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '204': { description: Widerrufen }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/administratoren:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    post:
      tags: [Nutzer]
      summary: Einen Nutzer des Mandanten als Administrator einsetzen
      description: Der Administrator pflegt Nutzer, Bücher, Rollen und Module in jedem Buch des Mandanten; Buchungsdaten sieht er nicht (BUECHER.md A6).
      x-kumero-recht: mandant.administrator
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [nutzer], additionalProperties: false, properties: { nutzer: { type: string, format: uuid } } }
      responses:
        '201': { description: Eingesetzt }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/administratoren/{id}:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { name: id, in: path, required: true, description: Nutzer-ID, schema: { type: string, format: uuid } } ]
    delete:
      tags: [Nutzer]
      summary: Administrator abberufen – der letzte bleibt (409 `KM003`)
      x-kumero-recht: mandant.administrator
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '204': { description: Abberufen }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/api/v1/buecher:
    parameters: [ { $ref: '#/components/parameters/mandant' } ]
    get:
      tags: [Bücher]
      summary: Bücher des Mandanten, in die der Nutzer hineindarf; der Administrator sieht alle (ohne Inhalt) und die Aufträge der letzten sieben Tage
      x-kumero-recht: angemeldet
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  buecher: { type: array, items: { $ref: '#/components/schemas/Buch' } }
                  administrator: { type: boolean }
                  auftraege:
                    type: array
                    items: { type: object, properties: { id: { type: string, format: uuid }, zustand: { type: string }, angelegt_am: { type: string, format: date-time }, ergebnis: { type: object, nullable: true } } }
    post:
      tags: [Bücher]
      summary: Buch anlegen – als Auftrag an den Dienst (wie „Mandant anlegen“, F118)
      description: Das Buch bekommt eine eigene Datenbank `kumero_<mandant>__<buch>`. Wer es beauftragt hat, steht nur im Auftrag; die Verwaltungsdatenbank nennt keinen Nutzer.
      x-kumero-recht: mandant.administrator
