        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/paperless/original:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    get:
      tags: [Paperless]
      summary: Originaldatei eines Belegs
      x-kumero-recht: paperless.beleg.sehen
      parameters:
        - { name: link, in: query, required: true, schema: { type: string }, description: Beleglink eines eigenen Paperless }
      responses:
        '200':
          description: Durchgereicht, nicht gespeichert (Cache-Control no-store)
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/paperless/verweis:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    post:
      tags: [Paperless]
      summary: Belegverweis mit Prüfung – Original laden, MD5 und SHA-256 rechnen, MD5 gegen Paperless abgleichen (F10, F51 Nr. 4)
      x-kumero-recht: paperless.beleg.sehen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [link], additionalProperties: false, properties: { link: { type: string } } }
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Belegverweis' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/paperless/vorgabe:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    put:
      tags: [Paperless]
      summary: Adresse des Paperless für den Mandanten vorgeben; adresse null entfernt die Vorgabe
      x-kumero-recht: paperless.vorgabe.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [adresse], additionalProperties: false, properties: { adresse: { type: [string, 'null'] }, bezeichnung: { type: string } } }
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema: { type: object }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/paperless/ablage:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    put:
      tags: [Paperless]
      summary: Einstellung des Mandanten zur Belegablage – nimmt das Paperless E-Rechnungen als XML an (Parser-Plugin, F112)
      x-kumero-recht: paperless.vorgabe.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [e_rechnung_xml], additionalProperties: false, properties: { e_rechnung_xml: { type: boolean } } }
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema: { type: object, properties: { ablage: { type: object, properties: { e_rechnung_xml: { type: boolean } } } } }
        '409': { $ref: '#/components/responses/Problem' }
  # ===========================================================================
  # Modul siegel (SIEGEL.md Abschnitt 6, F119, F120, F124) – nur wenn das Modul im Mandanten aktiv ist
  # ===========================================================================
  /m/{mandant}/b/{buch}/api/v1/siegel:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    get:
      tags: [Siegel]
      summary: Stand der Ketten, offene Anforderung, festgeschriebene Siegel (neuestes zuerst, höchstens 200) mit ihren Signaturen, öffentliche Schlüssel
      description: Die Liste trägt weder Schlüssel noch Signaturen im Volltext; dafür gibt es die Datei-Endpunkte.
      x-kumero-recht: siegel.siegel.sehen
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  kettenkoepfe:
                    type: object
                    properties:
                      buchungen: { $ref: '#/components/schemas/Kettenkopf' }
                      protokoll: { $ref: '#/components/schemas/Kettenkopf' }
                  anforderung: { allOf: [ { $ref: '#/components/schemas/Siegelanforderung' } ], nullable: true, description: 'Die offene, vorläufige Anforderung – höchstens eine; `null`, wenn keine offen ist' }
                  siegel: { type: array, items: { $ref: '#/components/schemas/Siegel' } }
                  schluessel: { type: array, items: { $ref: '#/components/schemas/Siegelschluessel' } }
                  namen: { type: object, additionalProperties: { type: string }, description: 'Subjekt `nutzer:<uuid>` → Name, für die Anzeige' }
    post:
      tags: [Siegel]
      summary: Siegel anfordern – hält beide Kettenköpfe vorläufig fest und bildet den Siegelinhalt
      description: >
        Es entsteht nur eine **vorläufige Anforderung**: kein Siegel, kein Protokolleintrag (F124). Sie gilt 24 Stunden
        und lässt sich verwerfen. Höchstens eine ist offen (409 `KM003`), weil Nummer und Prüfsumme des vorigen Siegels
        im signierten Inhalt stehen.
      x-kumero-recht: siegel.siegel.anfordern
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '201':
          description: Angefordert (vorläufig)
          content: { application/json: { schema: { $ref: '#/components/schemas/Siegelanforderung' } } }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/siegel/{id}:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    delete:
      tags: [Siegel]
      summary: Offene Anforderung verwerfen – spurlos, festgeschrieben war noch nichts
      description: Ein festgeschriebenes Siegel wird nie verworfen (409 `siegel.festgeschrieben`).
      x-kumero-recht: siegel.siegel.anfordern
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '204': { description: Verworfen }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/siegel/{id}/festschreiben:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [Siegel]
      summary: Bestätigung – Siegel, Signatur und Protokolleintrag in einer Transaktion festschreiben
      description: >
        Verlangt eine geprüfte Signatur an der Anforderung. Das Siegel behält die ID der Anforderung. Abgelehnt mit 409:
        ohne Signatur, verfallen, Schlüssel inzwischen zurückgezogen (`KM003`), schon festgeschrieben (`siegel.festgeschrieben`).
      x-kumero-recht: siegel.siegel.anfordern
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '201':
          description: Festgeschrieben
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string, format: uuid }, nr: { type: integer }, inhalt_sha256: { type: string } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/siegel/{id}/inhalt:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [Siegel]
      summary: Der Siegelinhalt als Datei – genau die Bytes, die zu signieren sind (kanonisches JSON nach RFC 8785, ohne Zeilenende); für ein Siegel oder die offene Anforderung
      x-kumero-recht: siegel.siegel.sehen
      responses:
        '200':
          description: Datei `kumero-siegel-<mandant>-<nr>.json`
          content: { application/json: { schema: { $ref: '#/components/schemas/Siegelinhalt' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/siegel/{id}/signaturen:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [Siegel]
      summary: Signatur hochladen – geprüft gegen den Siegelinhalt und die angemeldeten Schlüssel
      description: >
        An der **offenen Anforderung** wird die geprüfte Signatur nur vermerkt (200, `festgeschrieben: false`); eine frühere
        wird ersetzt. Festgeschrieben wird erst mit `…/festschreiben`. An einem **festgeschriebenen Siegel** ist sie eine
        weitere Signatur und sofort eingetragen (201, `festgeschrieben: true`).
        Erwartet wird eine abgesetzte OpenPGP-Signatur in ASCII-Hülle (`gpg --armor --detach-sign`), SHA-256 oder stärker.
        Fehlercodes: `siegel.schluessel_unbekannt` (409), `siegel.signatur_ungueltig`, `siegel.signatur_schwach`,
        `siegel.signatur_unlesbar`, `siegel.schluessel_ungueltig` (422), `siegel.pruefung_fehlt` (503).
      x-kumero-recht: siegel.siegel.anfordern
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [signatur], additionalProperties: false, properties: { signatur: { type: string, maxLength: 16384 } } }
      responses:
        '200':
          description: Geprüft und an der Anforderung vermerkt – noch nicht festgeschrieben
          content: { application/json: { schema: { $ref: '#/components/schemas/Siegelsignaturergebnis' } } }
        '201':
          description: Als weitere Signatur am festgeschriebenen Siegel eingetragen
          content: { application/json: { schema: { $ref: '#/components/schemas/Siegelsignaturergebnis' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/siegel/{id}/signaturen/{fpr}:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: fpr, in: path, required: true, schema: { type: string, pattern: '^[0-9A-F]{40,64}$' } } ]
    get:
      tags: [Siegel]
      summary: Eine Signatur als Datei, damit Dritte die Prüfung wiederholen können
      x-kumero-recht: siegel.siegel.sehen
      responses:
        '200': { description: Signatur in ASCII-Hülle, content: { application/pgp-signature: { schema: { type: string } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/siegel/schluessel:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    post:
      tags: [Siegel]
      summary: Öffentlichen Schlüssel anmelden – Fingerabdruck, Kennung und Verfahren liest kumero aus dem Schlüssel
      description: Ein privater Schlüssel wird abgewiesen und nicht gespeichert (`siegel.privater_schluessel`, 422).
      x-kumero-recht: siegel.schluessel.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [schluessel], additionalProperties: false, properties: { schluessel: { type: string, maxLength: 65536 } } }
      responses:
        '201':
          description: Angemeldet
          content:
            application/json:
              schema: { type: object, properties: { fpr: { type: string }, kennung: { type: string }, algorithmus: { type: string } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/siegel/schluessel/{fpr}:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' }, { name: fpr, in: path, required: true, schema: { type: string, pattern: '^[0-9A-F]{40,64}$' } } ]
    get:
      tags: [Siegel]
      summary: Der öffentliche Schlüssel als Datei
      x-kumero-recht: siegel.siegel.sehen
      responses:
        '200': { description: Schlüssel in ASCII-Hülle, content: { application/pgp-keys: { schema: { type: string } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/siegel/schluessel/{fpr}/zurueckziehen:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' }, { name: fpr, in: path, required: true, schema: { type: string, pattern: '^[0-9A-F]{40,64}$' } } ]
    post:
      tags: [Siegel]
      summary: Schlüssel zurückziehen – er nimmt keine neuen Signaturen mehr an; bestehende Siegel bleiben prüfbar
      x-kumero-recht: siegel.schluessel.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [grund], additionalProperties: false, properties: { grund: { type: string, maxLength: 300 } } }
      responses:
        '204': { description: Zurückgezogen }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  # ===========================================================================
  # Modul buchen (BUCHUNGSMASKE.md Abschnitt 3 und 5, F83) – nur wenn das Modul im Mandanten aktiv ist
  # ===========================================================================
  /m/{mandant}/b/{buch}/api/v1/buchen/vorlagen:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    get:
      tags: [Buchen]
      summary: Geschäftsvorfälle (Buchungsvorlagen), sortiert nach Reihenfolge, Gruppe, Name
      x-kumero-recht: buchen.vorlage.sehen
      responses:
        '200':
          description: Vorlagen
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BuchenVorlage' } }
    post:
      tags: [Buchen]
      summary: Vorlage anlegen
      x-kumero-recht: buchen.vorlage.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuchenVorlageInhalt' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuchenVorlage' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/buchen/vorlagen/vorgaben:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    post:
      tags: [Buchen]
      summary: Mitgelieferte allgemeine Vorlagen übernehmen
      description: Legt die mitgelieferten Vorlagen an, soweit es sie (Gruppe und Name) noch nicht gibt (M5).
      x-kumero-recht: buchen.vorlage.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema:
                type: object
                properties:
                  angelegt: { type: integer }
                  vorhanden: { type: integer }
  /m/{mandant}/b/{buch}/api/v1/buchen/vorlagen/{id}:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { $ref: '#/components/parameters/buch' }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Buchen]
      summary: Vorlage ersetzen
      x-kumero-recht: buchen.vorlage.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuchenVorlageInhalt' }
      responses:
        '200':
          description: Ersetzt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuchenVorlage' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Buchen]
      summary: Vorlage löschen
      x-kumero-recht: buchen.vorlage.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '204': { description: Gelöscht (im Protokoll mit Vorher-Stand) }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    sitzung:
      type: apiKey
      in: cookie
      name: __Host-kumero
    dienstkonto:
      type: http
      scheme: bearer
      bearerFormat: 'kmr_…'

  parameters:
    mandant:
      name: mandant
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$' }
    buch:
      name: buch
      in: path
      required: true
      description: Kennung des Buchs im Mandanten (BUECHER.md B2). Ein Buch ohne Rolle für den Nutzer antwortet wie ein unbekanntes mit 404 `buch.unbekannt`.
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,19}$' }
    geschaeftsjahr:
      name: geschaeftsjahr
      in: path
      required: true
      description: Kennung, z. B. 2026
      schema: { type: string }
    buchung:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    idempotenz:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 255 }
    ifMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    cursor:
      name: cursor
      in: query
      schema: { type: string }
    anzahl:
      name: anzahl
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }

  headers:
    ETag:
      description: Stand eines Entwurfs; für If-Match (F19)
      schema: { type: string }

  responses:
    Problem:
      description: Fehler nach RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Kettenkopf:
      type: object
      properties: { nr: { type: integer }, hash: { type: string, pattern: '^[0-9a-f]{64}$' } }
    Siegelinhalt:
      type: object
      description: Was signiert wird (SIEGEL.md Abschnitt 3). Kanonisch nach RFC 8785.
      properties:
        art: { type: string, enum: [kumero-siegel] }
        fassung: { type: integer, enum: [1] }
        mandant: { type: string }
        nr: { type: integer }
        zeitpunkt: { type: string, format: date-time }
        buchungen: { type: object, properties: { bis_nr: { type: integer }, hash: { type: string } } }
        protokoll: { type: object, properties: { bis_nr: { type: integer }, hash: { type: string } } }
        vorgaenger: { type: string, nullable: true, description: SHA-256 des vorigen Siegelinhalts }
    AuswertungEingabe:
      type: object
      required: [name, definition]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 80 }
        geteilt: { type: boolean, default: false, description: für alle im Buch sichtbar }
        definition: { $ref: '#/components/schemas/Auswertungsdefinition' }
    Auswertung:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        geteilt: { type: boolean }
        eigene: { type: boolean, description: gehört dem Anfragenden – nur dann änderbar }
        definition: { $ref: '#/components/schemas/Auswertungsdefinition' }
        geaendert_am: { type: string, format: date-time }
    Auswertungsdefinition:
      type: object
      additionalProperties: false
      description: Zusammenstellung einer Auswertung (AUSWERTUNGEN.md 8.1). Unbekannte Felder werden abgewiesen.
      properties:
        art: { type: string, enum: [konten, journal, kontoblaetter], default: konten }
        zeitraum: { type: string, enum: [monat, vormonat, quartal, vorquartal, jahr, vorjahr, frei], default: jahr }
        von: { type: string, format: date, description: nur bei zeitraum frei }
        bis: { type: string, format: date }
        entwuerfe: { type: boolean, default: false }
        spalten: { type: array, minItems: 1, items: { type: string, enum: [vortrag, soll, haben, soll_jahr, haben_jahr, saldo] } }
        ohne_null: { type: boolean, default: true, description: Konten ohne Bewegung und ohne Saldo weglassen }
        gliederung: { type: string, enum: [kontoart, eigene, keine], default: kontoart }
        einzeln: { type: boolean, default: true, description: bei eigener Gliederung die Konten unter jeder Zeile zeigen }
        konten: { type: string, maxLength: 500, description: 'leer = alle; Nummern, Bereiche und Anfänge, z. B. "4200-4299, 4900, 48*"' }
        kontoarten: { type: array, items: { $ref: '#/components/schemas/Kontoart' }, description: leer = alle }
        zeilen:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [titel]
            properties:
              titel: { type: string, maxLength: 100 }
              konten: { type: string, maxLength: 500 }
              summe: { type: boolean, description: Summe der Zeilen seit der vorigen Summenzeile }
    Buch:
      type: object
      properties:
        kennung: { type: string }
        name: { type: string }
        art: { type: string, enum: [euer, bilanz] }
        testbuch: { type: boolean }
        betriebsart: { type: string, enum: [test, produktiv] }
        lesemodus: { type: boolean }
        kopie_von: { type: string, nullable: true, description: Kennung des Buchs, aus dem dieses Testbuch übernommen wurde (Stufe D, noch nicht gebaut) }
        kopie_stand: { type: string, format: date-time, nullable: true }
        zustand: { type: string, enum: [bereit] }
        zugang: { type: boolean, description: Der Nutzer hat in diesem Buch eine laufende Rolle }
    Nutzer:
      type: object
      properties:
        id: { type: string, format: uuid }
        vornamen: { type: string, nullable: true }
        familienname: { type: string }
        email: { type: string, nullable: true }
        aktiv: { type: boolean }
        angelegt_am: { type: string, format: date-time }
        letzte_anmeldung: { type: string, format: date-time, nullable: true }
        zugang_bis: { type: string, format: date-time, nullable: true, description: Ablauf des offenen Zugangs }
        passkeys:
          type: array
          description: nicht widerrufene Anmelde-Passkeys
          items: { type: object, properties: { id: { type: string }, bezeichnung: { type: string, nullable: true }, registriert_am: { type: string, format: date-time } } }
        administrator: { type: boolean, description: Hat das Amt des Administrators im Mandanten }
    Siegelsignaturergebnis:
      type: object
      properties:
        siegel: { type: string, format: uuid }
        schluessel: { type: string }
        signiert_am: { type: string, format: date-time }
        festgeschrieben: { type: boolean }
    Siegelanforderung:
      type: object
      description: Vorläufige Anforderung eines Siegels (F124) – nicht Teil der Ketten, verwerfbar, 24 Stunden gültig.
      properties:
        id: { type: string, format: uuid, description: wird beim Festschreiben die ID des Siegels }
        nr: { type: integer }
        angefordert_am: { type: string, format: date-time }
        angefordert_von: { type: string }
        gueltig_bis: { type: string, format: date-time }
        buchungen_nr: { type: integer }
        protokoll_nr: { type: integer }
        inhalt_sha256: { type: string }
        signatur:
          type: object
          nullable: true
          description: Die geprüfte, noch nicht festgeschriebene Signatur
          properties:
            schluessel: { type: string }
            art: { type: string, enum: [pgp] }
            kennung: { type: string }
            signiert_am: { type: string, format: date-time }
            geprueft_am: { type: string, format: date-time }
    Siegel:
      type: object
      properties:
        id: { type: string, format: uuid }
        nr: { type: integer }
        status: { type: string, enum: [ausstehend, signiert, gestempelt], description: '`ausstehend` tragen nur Siegel, die vor 0.7.28 angefordert und nie signiert wurden' }
        angefordert_am: { type: string, format: date-time }
        angefordert_von: { type: string }
        buchungen_nr: { type: integer }
        protokoll_nr: { type: integer }
        inhalt_sha256: { type: string }
        buchungen_danach: { type: integer, description: Buchungen, die nach diesem Siegel festgeschrieben wurden }
        signaturen:
          type: array
          items:
            type: object
            properties:
              schluessel: { type: string }
              art: { type: string, enum: [pgp] }
              kennung: { type: string }
              signiert_am: { type: string, format: date-time, description: Zeitangabe aus der Signatur (Uhr des Unterzeichners) }
              eingereicht_am: { type: string, format: date-time }
              eingereicht_von: { type: string }
    Siegelschluessel:
      type: object
      properties:
        fpr: { type: string }
        art: { type: string, enum: [pgp] }
        kennung: { type: string }
        algorithmus: { type: string }
        angemeldet_am: { type: string, format: date-time }
        angemeldet_von: { type: string }
        zurueckgezogen_am: { type: string, format: date-time, nullable: true }
        zurueckgezogen_grund: { type: string, nullable: true }
        signaturen: { type: integer }
    Auftrag:
      type: object
      description: Auftrag der Mandantenverwaltung; ausgeführt vom Dienst kumero-auftraege. Nennt nie Angaben zu Personen.
      properties:
        id: { type: string, format: uuid }
        art: { type: string, enum: [mandant_anlegen, mandant_exportieren, mandant_loeschen, buch_anlegen] }
        mandant: { type: string }
        zustand: { type: string, enum: [offen, laeuft, erledigt, fehlgeschlagen] }
        angelegt_am: { type: string, format: date-time }
        beendet_am: { type: [string, 'null'], format: date-time }
        ergebnis: { type: [object, 'null'], description: 'Export: datei, groesse, sha256; Löschen: kettenkopf; gescheitert: code' }
    ImportRechnungBericht:
      type: object
      properties:
        format: { type: string, description: 'z. B. „XRechnung, CII“ oder „ZUGFeRD / Factur-X (Extended), CII im PDF“' }
        stand: { type: string, enum: [neu, fehlerhaft, vorhanden] }
        fehler: { type: [string, 'null'], description: Was der Rechnung fehlt – sie wird dann markiert eingeliefert }
        eintrag: { type: object, description: Felder des Eintrags im Arbeitsvorrat (ohne Hinweise) }
        hinweise: { type: array, items: { type: string } }
        waehrung: { type: string }
        faellig: { type: [string, 'null'], format: date }
        positionen: { type: integer }
        positionsnamen: { type: array, items: { type: string }, description: Namen der ersten Positionen }
        lieferdatum: { type: [string, 'null'], format: date }
        steuern: { type: array, description: Steueraufschlüsselung der Rechnung, items: { type: object, properties: { satz: { type: string }, kategorie: { type: string }, basis: { type: string }, betrag: { type: string } } } }
    Dezimal:
      type: string
      pattern: '^[0-9]{1,13}\.[0-9]{2}$'
      description: Betrag in Buchwährung, immer positiv, genau zwei Nachkommastellen (F24)
      examples: ['119.00']
    Kurs:
      type: string
      pattern: '^[0-9]{1,9}\.[0-9]{6,10}$'
      description: Mengennotierung, Einheiten Fremdwährung je 1 Buchwährung (F12)
    Kontoart: { enum: [aktiv, passiv, aufwand, ertrag] }
    Buchungsstatus: { enum: [entwurf, freigabebereit, festgeschrieben] }

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, description: 'URN, z. B. urn:kumero:problem:KM002' }
        title: { type: string, description: übersetzt }
        status: { type: integer }
        code:
          type: string
          description: |
            Fester Code. Aus der Datenbank: KM001 Unveränderlichkeit (409), KM002 Buchungsregel (422),
            KM003 Zustand (409), KM004 kanonische Form (422), KM005 ETag (412), KM006 Idempotenz (409).
            Aus der Anwendung: anmeldung.erforderlich (401), recht.fehlt (403), mandant.unbekannt (404),
            nicht_gefunden (404), anfrage.ungueltig (400), webauthn.ungueltig (422),
            idempotenz.fehlt (400), etag.fehlt (428), modul.nicht_aktiv (404), nicht_umgesetzt (501),
            freigabe.nur_persoenlich (403, Dienstkonten geben nie frei, F78 O3),
            lesemodus (409), intern (500).
        detail: { type: string, description: übersetzte Meldung; nie Buchungsinhalte }
        instance: { type: string, description: Anfrage-ID }
        fehler:
          type: array
          description: bei anfrage.ungueltig je Feld
          items:
            type: object
            properties:
              feld: { type: string, examples: ['zeilen[1].betrag'] }
              meldung: { type: string }

    Ich:
      type: object
      properties:
        subjekt: { type: string, examples: ['nutzer:3f0c…'], description: 'Die ID gilt im Mandanten und verlässt ihn nicht (F114)' }
        name: { type: string, description: 'Vorname(n) und Familienname' }
        vornamen: { type: [string, 'null'] }
        familienname: { type: string }
        email: { type: [string, 'null'] }
        angaben_fehlen: { type: boolean, description: 'Vorname(n) und E-Mail fehlen noch (überführter Bestand, U6) – siehe PATCH /api/v1/ich' }
        mandant: { type: [string, 'null'], description: 'Kennung des Mandanten dieser Anmeldung; null für System-Verwalter' }
        sprache: { type: [string, 'null'], description: 'Sprache des Nutzers; null = wie der Browser (PROFIL.md U5)' }
        sprachen: { type: array, items: { type: string }, description: Wählbare Sprachen }
        einstellungen: { $ref: '#/components/schemas/Einstellungen' }
        verwalter: { type: boolean, description: 'System-Verwalter der Installation (eigene Identität, kein Mandant)' }
        mandanten:
          description: 'Seit 0.7.22 höchstens ein Eintrag: der Mandant dieser Anmeldung (leer für System-Verwalter)'
          type: array
          items:
            type: object
            properties:
              kennung: { type: string }
              name: { type: string }

    PaperlessVerbindung:
      type: object
      description: Verbindung des Nutzers zu einem Paperless-ngx; das Token wird nie ausgegeben
      properties:
        id: { type: string, format: uuid }
        bezeichnung: { type: string }
        adresse: { type: string }
        tag_offen: { type: [string, 'null'] }
        entsperrt: { type: boolean }
        geaendert_am: { type: string, format: date-time }
    VorratVorschlag:
      type: object
      required: [betreff]
      additionalProperties: false
      description: Felder eines Eintrags, wie eine Quelle (oder der Nutzer von Hand) sie vorschlägt (ARBEITSVORRAT.md Abschnitt 2)
      properties:
        betreff: { type: string, maxLength: 200 }
        art: { type: string, pattern: '^[a-z][a-z0-9_-]{0,39}$', examples: [rechnung, kassenbon] }
        gegenpartei: { type: string, maxLength: 200 }
        gegenpartei_kennung: { type: string, maxLength: 60 }
        datum: { type: string, format: date }
        betrag: { type: string, pattern: '^\d{1,13}(\.\d{1,2})?$', description: 'immer positiv (F24)' }
        richtung: { enum: [ausgabe, einnahme] }
        belegnummer: { type: string, maxLength: 36 }
        zahlweise: { enum: [bar, unbar] }
        zahltag: { type: string, format: date }
        belege: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Belegverweis' } }
        hinweise: { type: array, maxItems: 30, items: { type: object, required: [text], properties: { feld: { type: string }, text: { type: string, maxLength: 300 } } } }
        notiz: { type: string, maxLength: 1000, description: Nur beim Anlegen von Hand }
    ImportBericht:
      type: object
      properties:
        import: { type: [string, 'null'], format: uuid, description: Nur nach dem Einliefern. Bei CAMT ohne neue Umsätze null. }
        format: { type: string, description: Bei CAMT der Nachrichtentyp mit Version }
        bankkonto: { type: string, description: Bei CAMT die IBAN oder Kontokennung aus der Datei }
        zeilen: { type: integer }
        neu: { type: integer }
        vorhanden: { type: integer }
        fehlerhaft: { type: integer }
        fehler: { type: array, items: { type: object, properties: { zeile: { type: integer }, grund: { type: string } } } }
        einnahmen: { type: string }
        ausgaben: { type: string }
        von: { type: [string, 'null'], format: date }
        bis: { type: [string, 'null'], format: date }
        salden: { type: [object, 'null'], properties: { anfang: { type: string }, ende: { type: string }, stimmt: { type: boolean } } }
        beispiel: { type: array, items: { type: object } }
    Steuerkonten:
      type: object
      properties:
        steuerkonten: { type: array, items: { type: object, properties: { konto: { type: string }, satz: { type: string } } } }
    PaperlessRegeln:
      description: Je Ziel (betreff, art, gegenpartei, gegenpartei_kennung, datum, betrag, netto, steuer, richtung, belegnummer, zahlweise, zahltag, anzeigen) die Quellen in Reihenfolge
      type: object
      additionalProperties:
        type: array
        maxItems: 20
        items:
          type: object
          required: [art, name]
          additionalProperties: false
          properties:
            art: { enum: [fest, feld, tag] }
            name: { type: string, maxLength: 200 }
            wert: { type: string, maxLength: 60, description: nur bei art tag – der Wert, den das Tag bedeutet }
    PaperlessZuordnung:
      type: object
      properties:
        wirksam: { $ref: '#/components/schemas/PaperlessRegeln' }
        mandant: { oneOf: [ { $ref: '#/components/schemas/PaperlessRegeln' }, { type: 'null' } ] }
        eigene: { oneOf: [ { $ref: '#/components/schemas/PaperlessRegeln' }, { type: 'null' } ] }
        vorschlag: { $ref: '#/components/schemas/PaperlessRegeln' }
        ziele: { type: array, items: { type: string } }
        fest: { type: array, items: { type: string } }
        felder: { type: array, items: { type: object, properties: { name: { type: string }, typ: { type: string } } } }
        tags: { type: array, items: { type: string } }
        darf_vorgeben: { type: boolean }
    VorratEintrag:
      type: object
      properties:
        id: { type: string, format: uuid }
        zustand: { enum: [offen, in_arbeit, gebucht, verworfen] }
        betreff: { type: string }
        art: { type: [string, 'null'] }
        gegenpartei: { type: [string, 'null'] }
        gegenpartei_kennung: { type: [string, 'null'] }
        netto: { type: [string, 'null'] }
        steuer: { type: [string, 'null'] }
        vor_steuerkonto: { type: [string, 'null'] }
        aufgegangen: { type: integer, description: Zahl der Einträge, die in diesem aufgegangen sind }
        aehnlich: { type: [integer, 'null'], description: Nummer der Gruppe vermutlich gleicher Vorgänge (nur in der Liste der offenen Einträge) }
        datum: { type: [string, 'null'], format: date }
        betrag: { type: [string, 'null'] }
        richtung: { enum: [ausgabe, einnahme, null] }
        belegnummer: { type: [string, 'null'] }
        zahlweise: { enum: [bar, unbar, null] }
        zahltag: { type: [string, 'null'], format: date }
        belege: { type: array, items: { $ref: '#/components/schemas/Belegverweis' } }
        hinweise: { type: array, items: { type: object } }
        vermerke: { type: array, items: { type: object, properties: { am: { type: string, format: date-time }, text: { type: string } } } }
        vor_konto: { type: [string, 'null'], description: Vorauswahl des Nutzers – Soll }
        vor_gegenkonto: { type: [string, 'null'], description: Vorauswahl des Nutzers – Haben }
        vor_buchungsart: { type: [string, 'null'] }
        verworfen_grund: { type: [string, 'null'] }
        eingegangen_am: { type: string, format: date-time }
        erledigt_am: { type: [string, 'null'], format: date-time }
        erledigt_von: { type: [string, 'null'] }
        quellen: { type: array, items: { type: string } }
        buchungen: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, stand: { enum: [entwurf, festgeschrieben, storniert] } } } }
        beitraege: { type: array, description: Nur beim Lesen eines Eintrags, items: { type: object } }
        vorbelegung: { type: object, description: Nur beim Lesen eines Eintrags, properties: { vorlage: { type: [string, 'null'], format: uuid }, konto_gegenpartei: { type: [string, 'null'] } } }

    Einstellungen:
      type: object
      description: Einstellungen des Nutzers, Schlüssel mit Namensraum (PROFIL.md Abschnitt 3)
      additionalProperties: false
      properties:
        kern.betragseingabe: { enum: [dezimal, kaufmaennisch, null] }
        kern.schriftgroesse: { enum: [normal, gross, sehr_gross, null] }
        kern.kontrast: { enum: [system, normal, hoch, null] }

    Konto:
      type: object
      required: [nr, bezeichnung, kontoart, aktiv, bebucht]
      properties:
        nr: { type: string, examples: ['4930'] }
        bezeichnung: { type: string }
        kontoart: { $ref: '#/components/schemas/Kontoart' }
        aktiv: { type: boolean }
        bebucht: { type: boolean, description: true = Nummer und Kontoart fest (F74) }
    KontoNeu:
      type: object
      required: [nr, bezeichnung, kontoart]
      properties:
        nr: { type: string }
        bezeichnung: { type: string }
        kontoart: { $ref: '#/components/schemas/Kontoart' }
    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        herkunft: { enum: [manuell, paperless] }
        paperless_id: { type: [integer, 'null'] }
    Nummernkreis:
      type: object
      properties:
        kuerzel: { type: string }
        bezeichnung: { type: string }
        jahre:
          type: array
          items:
            type: object
            properties:
              geschaeftsjahr: { type: string }
              vorlage: { type: string }
              zuruecksetzen: { type: boolean }
              zaehler: { type: [integer, 'null'] }
    Buchungsart:
      type: object
      required: [kuerzel, bezeichnung, nummernkreis]
      properties:
        kuerzel: { type: string, examples: ['ER'] }
        bezeichnung: { type: string, examples: ['Eingangsrechnung'] }
        nummernkreis: { type: string, description: Kürzel des Standardkreises }
    Geschaeftsjahr:
      type: object
      properties:
        kennung: { type: string }
        beginn: { type: string, format: date }
        ende: { type: string, format: date }
        status: { enum: [offen, gesperrt] }

    Belegverweis:
      type: object
      required: [link]
      additionalProperties: false
      description: >-
        Verweis auf das Original im Belegarchiv (F10, F88): der ganze Link, dazu MD5 und SHA-256 des Originals.
        Die Prüfsummen dürfen gemeinsam fehlen (ungeprüfter Verweis); vorbereitet, festgeschrieben und
        nachgereicht wird das nur im Testbetrieb. Altbestand vor 0.7.2 trägt beim Lesen `paperless_id` statt `link`.
      properties:
        link: { type: string, maxLength: 500, pattern: '^https?://[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]{1,5})?(/[^\s?#]*)?$', examples: ['https://paperless.example.org/documents/5210/'] }
        md5: { type: [string, 'null'], pattern: '^[0-9a-f]{32}$' }
        sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
    Zeile:
      type: object
      description: In Entwürfen dürfen Felder fehlen (F62); beim Vorbereiten gelten alle Regeln.
      properties:
        konto: { type: string }
        seite: { enum: [S, H] }
        betrag: { $ref: '#/components/schemas/Dezimal' }
        fw_betrag: { type: string, description: 'mit den Nachkommastellen der Währung (F12)' }
        fw_waehrung: { type: string, pattern: '^[A-Z]{3}$' }
        kurs: { $ref: '#/components/schemas/Kurs' }
        kurs_datum: { type: string, format: date }
        kurs_art: { type: string, examples: [tageskurs_bank, ezb_referenz, bmf_ust_monat] }
        tags: { type: array, items: { type: string }, description: Tag-Namen }
        erweiterung: { type: object, additionalProperties: true, description: 'Erweiterungswerte, z. B. {"steuer.schluessel": "VSt19"} (F58)' }
    BuchungInhalt:
      type: object
      properties:
        buchungsart: { type: string, description: Kürzel }
        nummernkreis: { type: string, description: 'Kürzel; Standard: Kreis der Buchungsart' }
        belegdatum: { type: string, format: date }
        buchungsdatum: { type: string, format: date, description: bestimmt das Geschäftsjahr }
        belegnummer: { type: string }
        text: { type: string }
        erweiterung: { type: object, additionalProperties: true }
        belege: { type: array, items: { $ref: '#/components/schemas/Belegverweis' } }
        zeilen: { type: array, items: { $ref: '#/components/schemas/Zeile' } }
    Buchung:
      allOf:
        - $ref: '#/components/schemas/BuchungInhalt'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/Buchungsstatus' }
            herkunft: { enum: [manuell, api, import, bank] }
            storno_von: { type: [string, 'null'], format: uuid }
            storniert_durch: { type: [string, 'null'], format: uuid }
            erfasst_am: { type: string, format: date-time }
            erfasst_von: { type: string }
            freigabe_hash: { type: [string, 'null'], description: ab freigabebereit (F66) }
            journal_nr: { type: [integer, 'null'] }
            nr: { type: [string, 'null'] }
            festgeschrieben_am: { type: [string, 'null'], format: date-time }
            festgeschrieben_von: { type: [string, 'null'] }
            testbetrieb: { type: boolean, description: ohne Freigabe-Signatur festgeschrieben (F59) }
            hash: { type: [string, 'null'] }
            summe: { $ref: '#/components/schemas/Dezimal', description: Σ Soll }

    Kontoblatt:
      type: object
      properties:
        konto: { $ref: '#/components/schemas/Konto' }
        von: { type: string, format: date }
        bis: { type: string, format: date }
        anfangssaldo: { $ref: '#/components/schemas/Saldobetrag' }
        endsaldo: { $ref: '#/components/schemas/Saldobetrag' }
        bewegungen:
          type: array
          items:
            type: object
            properties:
              buchung: { type: string, format: uuid }
              journal_nr: { type: integer }
              nr: { type: string }
              buchungsdatum: { type: string, format: date }
              belegnummer: { type: string }
              text: { type: string }
              seite: { enum: [S, H] }
              betrag: { $ref: '#/components/schemas/Dezimal' }
              gegenkonten: { type: array, items: { type: string } }
        weiter: { type: [string, 'null'] }
    Saldobetrag:
      type: object
      description: Betrag positiv mit Seite, nie mit Vorzeichen (F24)
      properties:
        betrag: { $ref: '#/components/schemas/Dezimal' }
        seite: { enum: [S, H] }
    Saldo:
      type: object
      properties:
        konto: { type: string }
        bezeichnung: { type: string }
        kontoart: { $ref: '#/components/schemas/Kontoart' }
        soll: { $ref: '#/components/schemas/Dezimal' }
        haben: { $ref: '#/components/schemas/Dezimal' }
        saldo: { $ref: '#/components/schemas/Saldobetrag' }

    # --- WebAuthn (Felder base64url, wie in der WebAuthn-JSON-Darstellung) ---
    WebauthnAnfrageOptionen:
      type: object
      description: PublicKeyCredentialRequestOptionsJSON; userVerification immer "required" (F68)
      properties:
        challenge: { type: string }
        rpId: { type: string }
        timeout: { type: integer }
        userVerification: { const: required }
        allowCredentials:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { const: public-key }
    WebauthnErstellOptionen:
      type: object
      description: PublicKeyCredentialCreationOptionsJSON; nur ES256 (-7) und EdDSA (-8), Attestation "none" (E3)
      additionalProperties: true
    WebauthnAssertion:
      type: object
      required: [id, response]
      description: Ergebnis von navigator.credentials.get() als JSON
      properties:
        id: { type: string }
        response:
          type: object
          required: [authenticatorData, clientDataJSON, signature]
          properties:
            authenticatorData: { type: string }
            clientDataJSON: { type: string }
            signature: { type: string }
            userHandle: { type: [string, 'null'], description: 'Bei der Anmeldung Pflicht: das Pseudonym der Identität (F114)' }
    WebauthnRegistrierung:
      type: object
      required: [id, response]
      description: Ergebnis von navigator.credentials.create() als JSON
      properties:
        token: { type: string, description: Registrierungslink-Token (ohne Sitzung) }
        bezeichnung: { type: string }
        id: { type: string }
        response:
          type: object
          required: [attestationObject, clientDataJSON]
          properties:
            attestationObject: { type: string }
            clientDataJSON: { type: string }

    FreigabeChallenge:
      type: object
      properties:
        challenge_id: { type: string, format: uuid }
        art: { enum: [festschreibung, gj_sperren, gj_oeffnen] }
        inhalt:
          type: object
          description: |
            Genau das, was angezeigt werden muss und in den Inhalts-Hash eingeht: bei Festschreibung
            die Liste der Buchungen mit ihrem eingefrorenen Inhalt und Freigabe-Hash (F67),
            beim Geschäftsjahr der Sperrinhalt samt Beiträgen der Module (F75 Nr. 11).
        inhalt_hash: { type: string }
        ablauf: { type: string, format: date-time }
        optionen: { $ref: '#/components/schemas/WebauthnAnfrageOptionen' }
    FreigabeNachweis:
      type: object
      properties:
        challenge_id: { type: string, format: uuid, description: im Testbetrieb optional }
        assertion: { $ref: '#/components/schemas/WebauthnAssertion' }
    Passkey:
      type: object
      properties:
        credential: { type: string, description: Credential-ID base64url }
        bezeichnung: { type: string }
        algorithmus: { enum: [-7, -8] }
        registriert_am: { type: string, format: date-time }
        widerrufen_am: { type: [string, 'null'], format: date-time }
    Menue:
      type: object
      properties:
        bereiche:
          type: array
          items:
            type: object
            properties:
              id: { enum: [start, buchen, stammdaten, auswertungen, abschluss, einstellungen, verwaltung] }
              titel: { type: string }
              eintraege: { type: array, items: { $ref: '#/components/schemas/MenueEintrag' } }
        seiten:
          type: object
          description: '<modul>/<ziel> → URL der Seite (ES-Modul) und der Texte'
          additionalProperties:
            type: object
            properties: { url: { type: string }, texte: { type: [string, 'null'] } }
        mandant: { type: [string, 'null'] }
        rechte_system: { type: array, items: { type: string } }
        rechte_mandant: { type: array, items: { type: string } }
    MenueEintrag:
      type: object
      properties:
        id: { type: string }
        titel: { type: string }
        pfad: { type: string, description: 'z. B. #/m/praxis/kern/konten' }
        symbol: { type: [string, 'null'] }
        zaehler: { type: [string, 'null'] }
        unter: { type: array, items: { $ref: '#/components/schemas/MenueEintrag' } }
    KontenrahmenBericht:
      type: object
      properties:
        konten: { type: integer }
        bereiche: { type: integer }
        ausgelassen: { type: integer }
        pruefen: { type: integer, description: Kontoart aus unsicherem Bereich, zu bestätigen }
        offen: { type: integer, description: verhindern das Speichern }
        hinweise: { type: integer }
        kontoarten: { type: object, additionalProperties: { type: integer } }
        bereit: { type: boolean }
    KontenrahmenKonto:
      type: object
      properties:
        nr: { type: string }
        bezeichnung: { type: string }
        kontoart: { type: [string, 'null'] }
        kontoart_herkunft: { enum: [quelle, posten, regel, hand] }
        posten: { type: string, description: Bilanz- oder GuV-Posten laut Kontenrahmen (F81) }
        programmverbindung: { type: string }
        kennzeichen: { type: string }
        fussnote: { type: string }
        pruefen: { type: string }
        offen: { type: string }
    KontenrahmenEntwurfKurz:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        rahmen: { type: string }
        art: { enum: [pdf, csv] }
        angelegt_am: { type: string, format: date-time }
        angelegt_von: { type: string }
        geaendert_am: { type: [string, 'null'], format: date-time }
        bericht: { $ref: '#/components/schemas/KontenrahmenBericht' }
    KontenrahmenEntwurf:
      allOf:
        - { $ref: '#/components/schemas/KontenrahmenEntwurfKurz' }
        - type: object
          properties:
            fassung: { type: [string, 'null'] }
            regelwerk: { type: object }
            quelle: { type: object }
            konten: { type: array, items: { $ref: '#/components/schemas/KontenrahmenKonto' } }
            ausgelassen: { type: array, items: { type: object } }
            hinweise: { type: array, items: { type: object } }
            bereiche: { type: array, items: { type: object } }
            korrekturen: { type: object }
    KontenrahmenVorlageKurz:
      type: object
      properties:
        kennung: { type: string }
        name: { type: string }
        rahmen: { type: string }
        fassung: { type: [string, 'null'] }
        quelle_art: { type: string }
        eingelesen_am: { type: string, format: date-time }
        sha256: { type: string }
        bericht: { $ref: '#/components/schemas/KontenrahmenBericht' }
    BuchenVorlageInhalt:
      type: object
      required: [gruppe, name]
      description: |
        Geschäftsvorfall: belegt das Formular der Buchungserfassung vor – Daten, keine Logik. Konto, Gegenkonto,
        Buchungsart und Tags stehen als Nummer, Kürzel und Name darin; ob es sie gibt, prüft der Kern beim Buchen.
      properties:
        gruppe: { type: string, maxLength: 60, examples: ['Zahlungseingang'] }
        name: { type: string, maxLength: 100, description: je Gruppe eindeutig }
        konto: { type: [string, 'null'], description: steht im Soll }
        gegenkonto: { type: [string, 'null'], description: steht im Haben }
        buchungsart: { type: [string, 'null'], description: Kürzel }
        text: { type: [string, 'null'], maxLength: 500 }
        tags: { type: array, maxItems: 20, items: { type: string } }
        reihenfolge: { type: integer, minimum: 0, maximum: 100000, default: 100 }
    BuchenVorlage:
      allOf:
        - { $ref: '#/components/schemas/BuchenVorlageInhalt' }
        - type: object
          properties:
            id: { type: string, format: uuid }
