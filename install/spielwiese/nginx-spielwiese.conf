# kumero-Spielwiese – nginx-Site (von install/spielwiese.sh geschrieben; ersetzt die Site „kumero“ auf dieser Maschine)
# Öffentlich erreichbar ist nur der Pförtner. kumero selbst hört nur auf 127.0.0.1:@INTERN_PORT@ und ist unverändert:
# Dort gibt es wie immer keine Sitzung ohne Passkey (SPIELWIESE.md SW17).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name @SERVERNAME@;
    return 301 https://$host$request_uri;
}

# --- öffentlich: Dateien der Oberfläche direkt, alles andere an den Pförtner ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @SERVERNAME@;

    ssl_certificate     /etc/kumero/tls/fullchain.pem;
    ssl_certificate_key /etc/kumero/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root @KUMERO_VERZ@/public;
    # Kleine Grenze für Hochgeladenes (SW14)
    client_max_body_size 5m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/kumero-spielwiese.access.log;
    error_log  /var/log/nginx/kumero-spielwiese.error.log;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /spielwiese/seite.css {
        alias @PFOERTNER_VERZ@/seite.css;
    }

    location ~ "^/module/([a-z][a-z0-9-]*)/[0-9]+\.[0-9]+\.[0-9]+/([a-z0-9_/-]+\.(js|css|json|svg))$" {
        alias @KUMERO_VERZ@/module/$1/oeffentlich/$2;
        expires 7d;
    }

    # Bausteine des Kerns: Dateien, nie die Oberfläche selbst (app.html gibt der Pförtner erst nach der Bestätigung heraus)
    location /kern/ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME @PFOERTNER_VERZ@/pfoertner.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php@PHP_VERSION@-fpm-kumero-spielwiese.sock;
        fastcgi_keep_conn off;
        fastcgi_read_timeout 150s;
    }

    location ~ /\. {
        deny all;
    }
}

# --- nur von dieser Maschine: kumero, wie install.sh es einrichtet ---
server {
    listen 127.0.0.1:@INTERN_PORT@;
    server_name @SERVERNAME@;

    root @KUMERO_VERZ@/public;
    index index.php;
    client_max_body_size 5m;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/kumero.error.log;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php@PHP_VERSION@-fpm-kumero.sock;
        fastcgi_keep_conn off;
        fastcgi_param HTTPS on;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
