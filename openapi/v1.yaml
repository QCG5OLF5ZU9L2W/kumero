                name: { type: string, maxLength: 100 }
                art: { type: string, enum: [euer, bilanz], description: Art der Gewinnermittlung (B4) }
                buchwaehrung: { type: string, pattern: '^[A-Z]{3}$', default: EUR }
                testbuch: { type: boolean, default: false, description: Unveränderlich; ein Testbuch wird nie produktiv (B6) }
      responses:
        '202':
