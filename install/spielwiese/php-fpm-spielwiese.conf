; kumero-Spielwiese – eigener Pool für den Pförtner, eigener Systembenutzer (SW18). Von install/spielwiese.sh geschrieben.
[kumero-spielwiese]
user = kumero-spielwiese
group = kumero-spielwiese
listen = /run/php/php@PHP_VERSION@-fpm-kumero-spielwiese.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
env[SPIELWIESE_KONFIG] = /etc/kumero-spielwiese/pfoertner.php
php_admin_value[open_basedir] = @PFOERTNER_VERZ@:/etc/kumero-spielwiese:/var/lib/kumero-spielwiese:@KUMERO_VERZ@/public
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[upload_max_filesize] = 5M
php_admin_value[post_max_size] = 6M
