# kumero – von install.sh verwaltet (F160)
# Paketlisten zweimal am Tag holen, kurz bevor apt-daily-upgrade einspielt. Die Vorgabe von Debian streut die Zeit über
# zwölf Stunden; dann kann der Lauf am Morgen noch mit den Listen vom Vortag arbeiten.
[Timer]
OnCalendar=
OnCalendar=*-*-* 05:40,17:40
RandomizedDelaySec=15m
