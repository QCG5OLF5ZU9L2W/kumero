      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary, maxLength: 5242880 } }
      responses:
        '200':
          description: Bericht zur Datei
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportRechnungBericht' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/import/rechnung/einliefern:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    post:
      tags: [Import]
      summary: E-Rechnung als Eintrag in den Arbeitsvorrat einliefern; eine schon vorhandene Rechnung wird übersprungen (F108)
      x-kumero-recht: import.datei.einlesen
      parameters:
