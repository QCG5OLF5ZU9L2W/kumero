          content:
            application/json:
              schema: { $ref: '#/components/schemas/Buchungsart' }

  # ===========================================================================
  # Geschäftsjahre (B2)
  # ===========================================================================
  /m/{mandant}/b/{buch}/api/v1/geschaeftsjahre:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    get:
      tags: [Geschäftsjahre]
      summary: Geschäftsjahre
      x-kumero-recht: kern.stammdaten.sehen
      responses:
        '200':
          description: Geschäftsjahre nach Beginn
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Geschaeftsjahr' } }
    post:
      tags: [Geschäftsjahre]
      summary: Geschäftsjahr anlegen
      description: Beginn und Ende frei; lückenlos und ohne Überschneidung (F65).
      x-kumero-recht: kern.geschaeftsjahr.anlegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kennung, beginn, ende]
              properties:
                kennung: { type: string, examples: ['2027'] }
                beginn: { type: string, format: date }
                ende: { type: string, format: date }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Geschaeftsjahr' }
        '422': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/geschaeftsjahre/{geschaeftsjahr}/sperren:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { $ref: '#/components/parameters/buch' }
      - { $ref: '#/components/parameters/geschaeftsjahr' }
    post:
      tags: [Geschäftsjahre]
      summary: Geschäftsjahr sperren (Jahresabschluss, F33)
      description: |
        Vorher `POST /freigaben/challenge` mit `art: gj_sperren`. Module mit Beitrag zur
        Jahressperre (F75 Nr. 11) liefern ihren Beitrag in derselben Transaktion; fehlt einer, 409 `KM003`.
      x-kumero-recht: kern.geschaeftsjahr.sperren
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FreigabeNachweis' }
      responses:
        '200':
          description: Gesperrt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Geschaeftsjahr' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/geschaeftsjahre/{geschaeftsjahr}/oeffnen:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { $ref: '#/components/parameters/buch' }
      - { $ref: '#/components/parameters/geschaeftsjahr' }
    post:
      tags: [Geschäftsjahre]
      summary: Gesperrtes Geschäftsjahr wieder öffnen (Notfall, F36)
      x-kumero-recht: kern.geschaeftsjahr.oeffnen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FreigabeNachweis'
                - type: object
                  required: [begruendung]
                  properties:
                    begruendung: { type: string, minLength: 10 }
      responses:
        '200':
          description: Wieder offen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Geschaeftsjahr' }

  # ===========================================================================
  # Buchungen (B3)
  # ===========================================================================
  /m/{mandant}/b/{buch}/api/v1/buchungen:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    get:
      tags: [Buchungen]
      summary: Journal und Entwürfe
      description: Festgeschriebene nach Journalnummer, Entwürfe nach Erfassungszeit.
      x-kumero-recht: kern.buchung.sehen
      parameters:
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/Buchungsstatus' } }, style: form, explode: false }
        - { name: von, in: query, description: Buchungsdatum ab, schema: { type: string, format: date } }
        - { name: bis, in: query, description: Buchungsdatum bis, schema: { type: string, format: date } }
        - { name: konto, in: query, schema: { type: string } }
        - { name: buchungsart, in: query, schema: { type: string } }
        - { name: erfasst_von, in: query, description: 'z. B. Stapel eines Erfassers', schema: { type: string } }
        - { name: reihenfolge, in: query, description: 'auf = älteste zuerst (Standard), ab = neueste zuerst', schema: { enum: [auf, ab], default: auf } }
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/anzahl' }
      responses:
        '200':
          description: Seite
          content:
            application/json:
              schema:
                type: object
                required: [eintraege]
                properties:
                  eintraege: { type: array, items: { $ref: '#/components/schemas/Buchung' } }
                  weiter: { type: [string, 'null'], description: Cursor der nächsten Seite }
    post:
      tags: [Buchungen]
      summary: Entwurf anlegen
      description: |
        Entwürfe dürfen unvollständig sein (F62). Mit `vorbereiten: true` wird der Entwurf in
        derselben Transaktion vorbereitet (F66); die Antwort enthält dann den Freigabe-Hash.
        So bucht ein Buchhalter mit zwei Aufrufen: anlegen + vorbereiten, dann freigeben (F31).
      x-kumero-recht: kern.entwurf.anlegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BuchungInhalt'
                - type: object
                  properties:
                    vorbereiten: { type: boolean, default: false }
      responses:
        '201':
          description: Angelegt
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Buchung' }
        '422': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/buchungen/{id}:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { $ref: '#/components/parameters/buch' }
      - { $ref: '#/components/parameters/buchung' }
    get:
      tags: [Buchungen]
      summary: Buchung oder Entwurf lesen
      x-kumero-recht: kern.buchung.sehen
      responses:
        '200':
          description: Buchung
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Buchung' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Buchungen]
      summary: Entwurf ersetzen
      description: Nur Entwürfe (F20, F31). Ein freigabebereiter Entwurf fällt dabei auf `entwurf` zurück (F66).
      x-kumero-recht: kern.entwurf.aendern
      parameters:
        - { $ref: '#/components/parameters/idempotenz' }
        - { $ref: '#/components/parameters/ifMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuchungInhalt' }
      responses:
        '200':
          description: Ersetzt
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Buchung' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Buchungen]
      summary: Entwurf löschen
      x-kumero-recht: kern.entwurf.loeschen
      parameters:
        - { $ref: '#/components/parameters/idempotenz' }
        - { $ref: '#/components/parameters/ifMatch' }
      responses:
        '204': { description: Gelöscht (im Protokoll mit Vorher-Stand) }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/buchungen/{id}/vorbereiten:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { $ref: '#/components/parameters/buch' }
      - { $ref: '#/components/parameters/buchung' }
    post:
      tags: [Buchungen]
      summary: Entwurf vorbereiten (F66)
      description: Prüft alle Regeln, lässt Module anreichern und friert den Inhalt ein.
      x-kumero-recht: kern.entwurf.aendern
      parameters:
        - { $ref: '#/components/parameters/idempotenz' }
        - { $ref: '#/components/parameters/ifMatch' }
      responses:
        '200':
          description: Freigabebereit
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Buchung' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/buchungen/{id}/zuruecksetzen:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { $ref: '#/components/parameters/buch' }
      - { $ref: '#/components/parameters/buchung' }
    post:
      tags: [Buchungen]
      summary: Freigabebereit → Entwurf
      x-kumero-recht: kern.entwurf.aendern
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '200':
          description: Wieder Entwurf
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Buchung' }
  /m/{mandant}/b/{buch}/api/v1/buchungen/{id}/storno:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { $ref: '#/components/parameters/buch' }
      - { $ref: '#/components/parameters/buchung' }
    post:
      tags: [Buchungen]
      summary: Storno als Entwurf anlegen (F30)
      description: |
        Legt einen Entwurf mit getauschten Seiten an. Festgeschrieben wird er wie jede Buchung
        über `vorbereiten` und `POST /freigaben`; dafür braucht es `kern.buchung.stornieren`.
      x-kumero-recht: kern.storno.vorschlagen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                buchungsdatum: { type: string, format: date, description: 'Standard: heute (F30)' }
                text: { type: string }
      responses:
        '201':
          description: Storno-Entwurf
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Buchung' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/buchungen/{id}/belege:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { $ref: '#/components/parameters/buch' }
      - { $ref: '#/components/parameters/buchung' }
    post:
      tags: [Buchungen]
      summary: Beleg nachreichen (F27)
      x-kumero-recht: kern.beleg.nachreichen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Belegverweis' }
      responses:
        '201': { description: Nachgereicht (eigenes Kettenereignis, Buchung unverändert) }

  # ===========================================================================
  # Freigabe (F38, F66–F68)
  # ===========================================================================
  /m/{mandant}/b/{buch}/api/v1/freigaben/challenge:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    post:
      tags: [Freigabe]
      summary: Challenge für eine Freigabe ausstellen
      description: |
        Liefert den Inhalt, den die Oberfläche **genau so** anzeigen muss (F38), seinen Hash
        und die WebAuthn-Optionen. Die Challenge ist 5 Minuten gültig und nur einmal verwendbar (F68).
      x-kumero-recht: 'je nach Art: kern.buchung.festschreiben, bei Stornos kern.buchung.stornieren (F78 O2), kern.geschaeftsjahr.sperren, …'
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [art, buchungen]
                  properties:
                    art: { const: festschreibung }
                    buchungen: { type: array, minItems: 1, items: { type: string, format: uuid }, description: Reihenfolge = Stapelliste (F67) }
                - type: object
                  required: [art, geschaeftsjahr]
                  properties:
                    art: { enum: [gj_sperren, gj_oeffnen] }
                    geschaeftsjahr: { type: string }
                    begruendung: { type: string, description: nur bei gj_oeffnen }
      responses:
        '201':
          description: Challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreigabeChallenge' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '501': { description: 'gj_sperren und gj_oeffnen sind noch nicht umgesetzt (`nicht_umgesetzt`)' }
  /m/{mandant}/b/{buch}/api/v1/freigaben:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    post:
      tags: [Freigabe]
      summary: Buchungen freigeben und festschreiben (einzeln oder als Stapel)
      description: |
        Stornos und andere Buchungen werden getrennt freigegeben. Mit `assertion` prüft die Anwendung die
        WebAuthn-Signatur über die Challenge (F68); Bindung an Subjekt, Handlung und Inhalt prüft die Datenbank (F72).
      x-kumero-recht: 'kern.buchung.festschreiben, bei Stornos kern.buchung.stornieren (F78 O2)'
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FreigabeNachweis'
                - type: object
                  required: [buchungen]
                  properties:
                    buchungen: { type: array, minItems: 1, items: { type: string, format: uuid }, description: dieselbe Liste wie bei der Challenge }
      responses:
        '200':
          description: Festgeschrieben
          content:
            application/json:
              schema:
                type: object
                properties:
                  freigabe: { type: [string, 'null'], format: uuid, description: null im Testbetrieb ohne Assertion }
                  buchungen:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        journal_nr: { type: integer }
                        nr: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/passkeys:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    get:
      tags: [Freigabe]
      summary: Eigene Freigabe-Passkeys in diesem Mandanten
      x-kumero-recht: kern.credential.verwalten
      responses:
        '200':
          description: Passkeys
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Passkey' } }
    post:
      tags: [Freigabe]
      summary: Freigabe-Passkey registrieren
      description: Zweistufig wie bei der Anmeldung; ohne `attestation` liefert der Aufruf die Optionen.
      x-kumero-recht: kern.credential.verwalten
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bezeichnung: { type: string }
                registrierung: { $ref: '#/components/schemas/WebauthnRegistrierung' }
      responses:
        '200':
          description: Optionen (erster Schritt)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebauthnErstellOptionen' }
        '201':
          description: Registriert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Passkey' }
  /m/{mandant}/b/{buch}/api/v1/passkeys/{credential}:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { $ref: '#/components/parameters/buch' }
      - { name: credential, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Freigabe]
      summary: Freigabe-Passkey widerrufen
      description: Frühere Freigaben bleiben gültig und prüfbar (F38).
      x-kumero-recht: kern.credential.verwalten
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '204': { description: Widerrufen }

  # ===========================================================================
  # Abfragen (B4)
  # ===========================================================================
  /m/{mandant}/b/{buch}/api/v1/konten/{nr}/kontoblatt:
    parameters:
      - { $ref: '#/components/parameters/mandant' }
      - { $ref: '#/components/parameters/buch' }
      - { name: nr, in: path, required: true, schema: { type: string } }
    get:
      tags: [Abfragen]
      summary: Kontoblatt
      x-kumero-recht: kern.buchung.sehen
      parameters:
        - { name: von, in: query, required: true, schema: { type: string, format: date } }
        - { name: bis, in: query, required: true, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/anzahl' }
      responses:
        '200':
          description: Anfangssaldo, Bewegungen, Endsaldo (nur festgeschriebene Buchungen)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Kontoblatt' }
  /m/{mandant}/b/{buch}/api/v1/salden:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    get:
      tags: [Abfragen]
      summary: Salden aller Konten zum Stichtag
      x-kumero-recht: kern.buchung.sehen
      parameters:
        - { name: stichtag, in: query, required: true, schema: { type: string, format: date } }
        - { name: geschaeftsjahr, in: query, description: nur Bewegungen dieses Jahres (ohne Vortrag), schema: { type: string } }
        - { name: konto, in: query, description: 'nur diese Konten: bis zu 200 Nummern, mit Komma getrennt', schema: { type: string } }
      responses:
        '200':
          description: Salden
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Saldo' } }

  /m/{mandant}/b/{buch}/api/v1/auswertungen/vorlagen:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    get:
      tags: [Auswertungen]
      summary: Gespeicherte Auswertungen – die eigenen und die für alle im Buch freigegebenen (Modul auswertungen, F128)
      x-kumero-recht: kern.buchung.sehen
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  vorlagen: { type: array, items: { $ref: '#/components/schemas/Auswertung' } }
                  darf_speichern: { type: boolean }
                  darf_teilen: { type: boolean }
    post:
      tags: [Auswertungen]
      summary: Eigene Auswertung speichern
      description: Gespeichert wird die Zusammenstellung, keine Zahl. `geteilt` verlangt `auswertungen.vorlage.teilen`. Derselbe Name ein zweites Mal ergibt 409.
      x-kumero-recht: auswertungen.vorlage.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AuswertungEingabe' } } }
      responses:
        '201': { description: Gespeichert, content: { application/json: { schema: { $ref: '#/components/schemas/Auswertung' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/auswertungen/vorlagen/{id}:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    put:
      tags: [Auswertungen]
      summary: Eigene Auswertung ersetzen – eine fremde sieht aus wie eine unbekannte (404)
      x-kumero-recht: auswertungen.vorlage.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AuswertungEingabe' } } }
      responses:
        '200': { description: Ersetzt, content: { application/json: { schema: { $ref: '#/components/schemas/Auswertung' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Auswertungen]
      summary: Eigene Auswertung löschen
      x-kumero-recht: auswertungen.vorlage.pflegen
      parameters: [ { $ref: '#/components/parameters/idempotenz' } ]
      responses:
        '204': { description: Gelöscht }
        '404': { $ref: '#/components/responses/Problem' }
  /m/{mandant}/b/{buch}/api/v1/summen:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    get:
      tags: [Abfragen]
      summary: Summen je Konto und Zeitraum – Grundlage der Summen- und Saldenliste und eigener Auswertungen (AUSWERTUNGEN.md, F128)
      description: >
        Zeitraum nach Buchungsdatum; Anfang und Ende müssen im selben Geschäftsjahr liegen (sonst 400
        `zeitraum.geschaeftsjahr`). Der Vortrag wird gerechnet: Bestandskonten (aktiv, passiv) mit ihrem Saldo vom Tag
        vor dem Zeitraum, Erfolgskonten ab Beginn des Geschäftsjahres. `saldo` = Vortrag + Soll − Haben. Maßstab sind
        festgeschriebene Buchungen; mit `entwuerfe=ja` zählen Entwürfe mit Buchungsdatum mit.
      x-kumero-recht: kern.buchung.sehen
      parameters:
        - { name: von, in: query, required: true, schema: { type: string, format: date } }
        - { name: bis, in: query, required: true, schema: { type: string, format: date } }
        - { name: entwuerfe, in: query, schema: { type: string, enum: [ja, nein], default: nein } }
      responses:
        '200':
          description: Summen
          content:
            application/json:
              schema:
                type: object
                properties:
                  von: { type: string, format: date }
                  bis: { type: string, format: date }
                  geschaeftsjahr: { type: object, properties: { kennung: { type: string }, beginn: { type: string, format: date }, ende: { type: string, format: date }, status: { type: string, enum: [offen, gesperrt] } } }
                  entwuerfe: { type: boolean }
                  entwuerfe_im_jahr: { type: integer, description: nicht festgeschriebene Buchungen mit Buchungsdatum vom Jahresbeginn bis zum Ende des Zeitraums }
                  stand: { type: object, properties: { journal_nr: { type: integer, nullable: true }, nr: { type: string, nullable: true }, erstellt_am: { type: string, format: date-time } } }
                  konten:
                    type: array
                    items:
                      type: object
                      properties:
                        konto: { type: string }
                        bezeichnung: { type: string }
                        kontoart: { $ref: '#/components/schemas/Kontoart' }
                        bewegt: { type: boolean, description: es gibt Buchungen bis zum Ende des Zeitraums }
                        vortrag: { $ref: '#/components/schemas/Saldobetrag' }
                        soll: { $ref: '#/components/schemas/Dezimal' }
                        haben: { $ref: '#/components/schemas/Dezimal' }
                        soll_jahr: { $ref: '#/components/schemas/Dezimal' }
                        haben_jahr: { $ref: '#/components/schemas/Dezimal' }
                        saldo: { $ref: '#/components/schemas/Saldobetrag' }
        '400': { $ref: '#/components/responses/Problem' }

  # ===========================================================================
  # Mandantenverwaltung des System-Verwalters (VERWALTUNG.md Abschnitt 14, F118) – nur mit verwaltung.verwalter.
  # Anlegen, Exportieren und Löschen sind Aufträge: Die Antwort ist 202, ausgeführt wird vom Dienst kumero-auftraege.
  # ===========================================================================
  /api/v1/verwaltung/mandanten:
    get:
      tags: [Verwaltung]
      summary: Mandanten und die letzten Aufträge – ohne Angaben aus dem Inneren eines Mandanten (F43)
      x-kumero-recht: verwaltung.verwalter
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema:
                type: object
                properties:
                  mandanten:
                    type: array
                    items:
                      type: object
                      properties:
                        kennung: { type: string }
                        name: { type: [string, 'null'], description: null, solange der Mandant erst angelegt wird }
                        angelegt_am: { type: [string, 'null'], format: date-time }
                        stillgelegt_am: { type: [string, 'null'], format: date-time }
                        auftrag: { type: [string, 'null'], enum: [mandant_anlegen, mandant_exportieren, mandant_loeschen, null], description: laufender Auftrag }
                        export: { type: [object, 'null'], properties: { am: { type: string, format: date-time }, datei: { type: string }, groesse: { type: integer }, sha256: { type: string } } }
                        loeschbar: { type: boolean, description: stillgelegt und danach exportiert }
                  auftraege: { type: array, items: { $ref: '#/components/schemas/Auftrag' } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Verwaltung]
      summary: Mandant anlegen und seinen ersten Administrator einsetzen (U5) – die Antwort nennt den Zugang einmal
      x-kumero-recht: verwaltung.verwalter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kennung, name, administrator]
              additionalProperties: false
              properties:
                kennung: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$' }
                name: { type: string, maxLength: 100 }
                administrator:
                  type: object
                  required: [vornamen, familienname, email]
                  additionalProperties: false
                  properties: { vornamen: { type: string, maxLength: 100 }, familienname: { type: string, maxLength: 100 }, email: { type: string, format: email, maxLength: 200 } }
      responses:
        '202':
          description: Auftrag angenommen
          content:
            application/json:
              schema: { type: object, properties: { auftrag: { type: string, format: uuid }, kennung: { type: string }, link: { type: string, description: 'Zugang des Administrators; wird nur hier genannt, gespeichert ist sein Hash' }, gueltig_stunden: { type: integer } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/verwaltung/mandanten/{kennung}:
    parameters: [ { name: kennung, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$' } } ]
    delete:
      tags: [Verwaltung]
      summary: Mandant löschen – nur stillgelegt und danach exportiert; nicht umkehrbar
      x-kumero-recht: verwaltung.verwalter
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [bestaetigung], additionalProperties: false, properties: { bestaetigung: { type: string, description: die Kennung des Mandanten } } }
      responses:
        '202': { description: Auftrag angenommen, content: { application/json: { schema: { type: object, properties: { auftrag: { type: string, format: uuid } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/verwaltung/mandanten/{kennung}/stilllegen:
    parameters: [ { name: kennung, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [Verwaltung]
      summary: Mandant stilllegen – niemand kann sich mehr anmelden, die Daten bleiben
      x-kumero-recht: verwaltung.verwalter
      responses:
        '204': { description: Erledigt }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/verwaltung/mandanten/{kennung}/reaktivieren:
    parameters: [ { name: kennung, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [Verwaltung]
      summary: Stillgelegten Mandanten wieder in Betrieb nehmen
      x-kumero-recht: verwaltung.verwalter
      responses:
        '204': { description: Erledigt }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/verwaltung/mandanten/{kennung}/export:
    parameters: [ { name: kennung, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [Verwaltung]
      summary: Vollständige Sicherung (pg_dump) in das Export-Verzeichnis des Servers – kein Download
      x-kumero-recht: verwaltung.verwalter
      responses:
        '202': { description: Auftrag angenommen, content: { application/json: { schema: { type: object, properties: { auftrag: { type: string, format: uuid } } } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/oberflaeche/menue:
    get:
      tags: [Oberfläche]
      summary: Menü der Weboberfläche ohne Mandant (Bereiche start und verwaltung)
      description: OBERFLAECHE.md 4, F80. Sichtbar nur, was die Systemrechte des Subjekts erlauben; Ausblenden ist kein Schutz.
      x-kumero-recht: angemeldet
      responses:
        '200':
          description: Menü
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menue' }
  /m/{mandant}/b/{buch}/api/v1/oberflaeche/menue:
    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    get:
      tags: [Oberfläche]
      summary: Menü im Mandanten (alle Bereiche)
      description: Einträge des Kerns und der im Mandanten aktiven Module, gefiltert nach den Rollen des Subjekts (F80 N3), dazu die systemweiten Bereiche.
      responses:
        '200':
          description: Menü
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menue' }
  /api/v1/kontenrahmen/regelwerke:
    get:
      tags: [Kontenrahmen]
      summary: Regelwerke für die Kontoart (z. B. skr81)
      x-kumero-recht: verwaltung.verwalter
      responses:
        '200':
          description: Regelwerke
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties: { name: { type: string }, rahmen: { type: string }, version: { type: string }, beschreibung: { type: string } }
  /api/v1/kontenrahmen/entwuerfe:
    get:
      tags: [Kontenrahmen]
      summary: Offene Entwürfe des Imports (installationsweit, neueste zuerst; nach 14 Tagen entfernt)
      x-kumero-recht: verwaltung.verwalter
      responses:
        '200':
          description: Entwürfe ohne Kontenliste
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/KontenrahmenEntwurfKurz' } }
    post:
      tags: [Kontenrahmen]
      summary: Datei einlesen → Entwurf (DATEV-PDF oder CSV)
      description: Die Datei steht im Körper der Anfrage. Gespeichert wird nur das Leseergebnis und der SHA-256 der Datei, nicht die Datei selbst.
      x-kumero-recht: verwaltung.verwalter
      parameters:
        - { name: regelwerk, in: query, schema: { type: string, default: skr81 } }
        - { name: name, in: query, schema: { type: string, maxLength: 120 } }
      requestBody:
        required: true
        content:
          application/pdf: { schema: { type: string, format: binary } }
          text/csv: { schema: { type: string } }
      responses:
        '201':
          description: Entwurf mit Prüfbericht
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KontenrahmenEntwurf' }
        '400': { $ref: '#/components/responses/Problem' }
