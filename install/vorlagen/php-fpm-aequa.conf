; Aequa – eigener PHP-FPM-Pool (von install.sh verwaltet)
[aequa]
user = aequa
group = aequa

listen = /run/php/php@PHP_VERSION@-fpm-aequa.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Nur die eigenen Verzeichnisse
php_admin_value[open_basedir] = @AEQUA_VERZ@:/etc/aequa:/var/lib/aequa:/var/log/aequa:/tmp:/usr/share/php
php_admin_value[error_log] = /var/log/aequa/php-fpm.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off

; Umgebung leeren; nötige Werte setzt die Anwendung aus /etc/aequa
clear_env = yes
security.limit_extensions = .php
