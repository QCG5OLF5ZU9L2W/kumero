# Angaben für die Spielwiese – von install/spielwiese.sh gelesen (/etc/kumero-spielwiese/spielwiese.conf).
# Was hier steht, zeigt der Pförtner auf der vorgeschalteten Seite. Wer die Maschine betreibt, verantwortet es.

# Betreiber, wie er auf der Seite genannt wird (Pflicht)
BETREIBER=""
# Adressen von Impressum und Datenschutzhinweis (Pflicht; die Seiten liegen beim Betreiber, nicht auf dieser Maschine)
IMPRESSUM=""
DATENSCHUTZ=""
# Finanzministerium des Landes, in dem der Betreiber sitzt – gehört nach dem Hinweis des BMF zur Quellenangabe des Vordrucks
LAND=""
# Wo der Quellcode liegt (AGPL)
QUELLCODE="https://github.com/QCG5OLF5ZU9L2W/kumero"
# Satz zum Rücksetzen; leer = „alle vier Stunden (0, 4, 8, 12, 16 und 20 Uhr)“. Der Zeitplan selbst liegt in Proxmox.
RUECKSETZEN=""

# Paperless der Spielwiese (leer = ohne). Der Spiel-Nutzer und sein Token entstehen in Paperless, nicht hier.
PAPERLESS_ADRESSE=""
PAPERLESS_TOKEN=""
PAPERLESS_TAG_OFFEN=""

# Firewall (UFW) setzen: eingehend nur SSH, 80 und 443; ausgehend nur Namensauflösung und Zeit sowie die Ziele unten.
FIREWALL="ja"
# Ausgehend zusätzlich erlaubte Ziele (IP oder Netz, durch Leerzeichen getrennt) – z. B. der Spiegel für Pakete
AUSGEHEND_ERLAUBT=""
# Port, auf dem kumero nur für diese Maschine erreichbar ist
INTERN_PORT="8081"
