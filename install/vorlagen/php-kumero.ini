; kumero – PHP-Einstellungen (von install.sh verwaltet, nicht von Hand ändern)
; Ablage nach Debian-Standard in /etc/php/@PHP_VERSION@/{fpm,cli}/conf.d/

date.timezone = UTC
default_charset = "UTF-8"
expose_php = Off

; Genauigkeit: Beträge werden nie als float verarbeitet (F24, F29),
; trotzdem sicherheitshalber volle Darstellung.
precision = 17
serialize_precision = -1

memory_limit = 3G
max_execution_time = 60
post_max_size = 1G
upload_max_filesize = 1G

session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Strict"

; Härtung (F160): kumero nutzt keine PHP-Sitzungen und zeigt keine Backtraces. Was es nicht braucht, bleibt aus –
; unabhängig davon, was die php.ini des Pakets vorgibt (Anlass: Sicherheits-Release vom 2026-11-19).
session.upload_progress.enabled = Off
zend.exception_ignore_args = On
fatal_error_backtraces = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
