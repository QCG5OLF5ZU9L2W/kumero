    parameters: [ { $ref: '#/components/parameters/mandant' }, { $ref: '#/components/parameters/buch' } ]
    post:
      tags: [Import]
      summary: Aufbau einer CSV-Datei erkennen – Merkmale, Spalten, Vorschlag der Zuordnung, passende Profile
      x-kumero-recht: import.datei.einlesen
