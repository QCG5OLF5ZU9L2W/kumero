# kumero – nginx-Site (von install.sh verwaltet)
# TLS zunächst mit dem Debian-Zertifikat "snakeoil" (Paket ssl-cert).
# Eigenes Zertifikat: ssl_certificate/ssl_certificate_key unten anpassen
# oder certbot (Debian-Paket python3-certbot-nginx) verwenden.

server {
    listen 80;
    listen [::]:80;
    server_name @SERVERNAME@;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @SERVERNAME@;

    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root @KUMERO_VERZ@/public;
    index index.php;

    client_max_body_size 32m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/kumero.access.log;
    error_log  /var/log/nginx/kumero.error.log;

    # Front-Controller: alles, was keine Datei ist, an index.php
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php@PHP_VERSION@-fpm-kumero.sock;
        fastcgi_param HTTPS on;
        internal;
    }

    # Andere PHP-Dateien niemals ausführen
    location ~ \.php$ {
        return 404;
    }

    # Versteckte Dateien sperren
    location ~ /\. {
        deny all;
    }
}
