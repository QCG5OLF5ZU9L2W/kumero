; kumero – eigener PHP-FPM-Pool (von install.sh verwaltet)
[kumero]
user = kumero
group = kumero

listen = /run/php/php@PHP_VERSION@-fpm-kumero.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Nur die eigenen Verzeichnisse
php_admin_value[open_basedir] = @KUMERO_VERZ@:/etc/kumero:/var/lib/kumero:/var/log/kumero:/tmp:/usr/share/php
php_admin_value[error_log] = /var/log/kumero/php-fpm.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off

; Umgebung leeren; nötige Werte setzt die Anwendung aus /etc/kumero
clear_env = yes
security.limit_extensions = .php
