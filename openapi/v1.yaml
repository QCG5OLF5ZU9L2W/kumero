  # ===========================================================================
  # Modul import (IMPORT.md, F104) – nur wenn das Modul im Mandanten aktiv ist. Die Datei ist der Körper der Anfrage
  # (text/csv, höchstens 5 MB) und wird nicht gespeichert; die Einstellungen stehen als JSON im Parameter einstellungen.
  # ===========================================================================
