# kumero – Sicherung (einmal vom Installer angelegt, danach vom Betreiber gepflegt; INSTALL.md Abschnitt 3b)
#
# Wohin install/sichern.sh schreibt. Wer den Ort ändert, trägt ihn auch bei ReadWritePaths in
# /etc/systemd/system/kumero-sicherung.service.d/ ein.
ZIEL=/var/lib/kumero/sicherungen
# Öffentlicher OpenPGP-Schlüssel, an den jede Sicherung verschlüsselt wird. Der private Teil gehört nicht auf diese
# Maschine. Leer = unverschlüsselt (dann ohne die privaten Schlüssel der Zertifikate).
EMPFAENGER=
# So viele Sicherungen bleiben liegen; 0 = nichts löschen.
BEHALTEN=14
