# kumero – nginx-Site (von install.sh verwaltet)
# TLS aus /etc/kumero/tls/: zunächst eine Kopie des Debian-Zertifikats "snakeoil";
# mit ZERTIFIKAT_QUELLE (install.conf) übernimmt kumero-zertifikat ein geliefertes
# Zertifikat, z. B. vom ACME-Client der OPNsense, und lädt nginx neu.

# Auffang (VERWALTUNG.md Abschnitt 18, DM4): Was unter keinem der Namen unten ankommt, wird nicht geroutet – die
# Verbindung endet ohne Antwort, bei TLS schon im Handshake (kein Zertifikat verrät einen Namen). kumero ändert diese
# Datei nach der Installation nie (DM14): Den Hostnamen eines Mandanten mit eigener Domain trägt root von Hand bei
# server_name ein (INSTALL.md Abschnitt 3c).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name @SERVERNAME@;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @SERVERNAME@;

    ssl_certificate     /etc/kumero/tls/fullchain.pem;
    ssl_certificate_key /etc/kumero/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root @KUMERO_VERZ@/public;
    index index.php;

    # Wie die Grenze des Moduls import für CSV und CAMT (350 MB, IMPORT.md Abschnitt 18, F117).
    # Wird die Grenze dort geändert, hier mitziehen.
    client_max_body_size 350m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Strenge CSP (F80 N5): nur eigene Quellen, kein Inline-Skript, auch nicht für Module
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/kumero.access.log;
    error_log  /var/log/nginx/kumero.error.log;

    # Seiten der Module aus dem signierten Release (OBERFLAECHE.md 5, F80 N5):
    # /module/<name>/<version>/<datei> → module/<name>/oeffentlich/<datei>
    location ~ "^/module/([a-z][a-z0-9-]*)/[0-9]+\.[0-9]+\.[0-9]+/([a-z0-9_/-]+\.(js|css|json|svg))$" {
        alias @KUMERO_VERZ@/module/$1/oeffentlich/$2;
        expires 7d;
    }

    # Front-Controller: alles, was keine Datei ist, an index.php
    location / {
        # Rahmen und Bausteine des Kerns (/app.html, /kern/…) haben keine Version im Pfad: Der Browser fragt jedes Mal nach,
        # ob sie sich geändert haben (304, wenn nicht). Sonst liefe nach einem Update alter Kern mit neuen Modulseiten.
        expires -1;
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php@PHP_VERSION@-fpm-kumero.sock;
        # je Anfrage eine Verbindung zu PHP-FPM, nie wiederverwenden (F160)
        fastcgi_keep_conn off;
        fastcgi_param HTTPS on;
        internal;
    }

    # Andere PHP-Dateien niemals ausführen
    location ~ \.php$ {
        return 404;
    }

    # Versteckte Dateien sperren
    location ~ /\. {
        deny all;
    }
}
